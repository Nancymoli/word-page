<!-- v=1.4 增加小学/初中/高中词库，全部7套词库，每个词库独立记忆背诵断点 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>小张刷英语</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
}
body{
  min-height: 100vh;
  background: linear-gradient(180deg, #fff6e8 0%, #ffe8f0 40%, #e8f3ff 100%);
  position: relative;
  overflow-x: hidden;
  padding-bottom: 30px;
}
/* 背景模糊泡泡 */
.bubble{
  position:absolute;
  border-radius:50%;
  opacity:0.5;
  filter: blur(14px);
  z-index: 0;
  pointer-events:none;
}
.bubble1{
  width:260px;
  height:260px;
  background:#ffb8dc;
  top:90px;
  left:-60px;
}
.bubble2{
  width:220px;
  height:220px;
  background:#b5dcff;
  top:110px;
  right:-40px;
}
/* 顶部标题 */
.top-title{
  position:relative;
  z-index:2;
  text-align:center;
  padding:14px 12px 4px;
}
.top-title h2{
  font-size:22px;
  font-weight:600;
  color:#333;
}
.progress-text{
  margin-top:6px;
  font-size:16px;
  color:#555;
}
/* 顶部按钮组 */
.ctrl{
  position:relative;
  z-index:2;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin:14px 12px 18px;
  align-items:center;
}
#dictSelect{
  padding:10px 14px;
  border-radius:999px;
  border:none;
  font-size:16px;
}
.jump-area{
  display:flex;
  gap:8px;
  align-items:center;
}
#jumpIndex{
  width:80px;
  padding:10px;
  border-radius:999px;
  border:none;
  font-size:16px;
  text-align:center;
}
button{
  border:none;
  padding:14px 22px;
  border-radius:999px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}
button:active{
  transform:scale(0.96);
}
.btn-blue{
  background:#a3d4ff;
  color:#222;
}
.btn-pink{
  background:#ffb3dd;
  color:#fff;
}
.btn-green{
  background:#9de0c4;
  color:#222;
}
.btn-orange{
  background:#ffd29d;
  color:#222;
}
/* 单词主卡片 */
.container{
  position:relative;
  z-index:1;
  padding:0 14px;
  max-width:640px;
  margin:0 auto;
}
.card{
  background:#ffffff;
  border-radius:28px;
  padding:32px 22px 28px;
  text-align:center;
  box-shadow:0 10px 30px rgba(255, 182, 220, 0.18);
  position:relative;
  z-index:2;
}
.word{
  font-size:52px;
  font-weight:800;
  color:#222;
  margin-bottom:12px;
}
.meaning-tag{
  display:inline-block;
  background:#a3d4ff;
  color:#222;
  font-size:20px;
  font-weight:600;
  padding:8px 18px;
  border-radius:999px;
  margin-bottom:24px;
}
.sentence-en{
  font-size:18px;
  color:#333;
  line-height:1.6;
  margin-bottom:8px;
}
.sentence-cn{
  font-size:17px;
  color:#666;
  line-height:1.5;
}
/* 设置面板 */
.setting-area{
  margin-top:20px;
  background:#ffffff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(163, 212, 255, 0.15);
}
.set-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:16px 0;
  font-size:16px;
  color:#333;
}
.set-row input[type="number"]{
  width:72px;
  padding:8px;
  border-radius:10px;
  border:1px solid #ffc9e2;
  background:#fff;
  text-align:center;
  font-size:16px;
}
/* 自定义开关 */
.switch-wrap{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:10px;
}
.switch-item{
  display:flex;
  align-items:center;
  gap:8px;
}
.switch{
  position:relative;
  width:48px;
  height:28px;
  background:#ffc5e3;
  border-radius:999px;
  cursor:pointer;
  transition:0.3s;
}
.switch::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:22px;
  height:22px;
  background:#fff;
  border-radius:50%;
  transition:0.3s;
}
.switch.active{
  background:#ff88bc;
}
.switch.active::after{
  left:23px;
}
/* 底部导入按钮 */
.import-wrap{
  margin-top:22px;
  text-align:center;
}
.import-btn{
  display:inline-block;
  padding:14px 28px;
  background:#a3d4ff;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
}
#fileInput{
  display:none;
}
</style>
</head>
<body>
<div class="bubble bubble1"></div>
<div class="bubble bubble2"></div>

<div class="top-title">
  <h2>📖 小张刷英语</h2>
  <div class="progress-text" id="progressText">进度：0 / 0</div>
</div>

<div class="ctrl">
  <select id="dictSelect"></select>
  <button class="btn-blue" id="loadOnline">加载选中词库</button>
  <div class="jump-area">
    <input type="number" id="jumpIndex" placeholder="跳到第几个">
    <button class="btn-orange" id="jumpBtn">跳转</button>
  </div>
  <button class="btn-pink" id="startBtn">开始刷词</button>
  <button class="btn-green" id="stopBtn">暂停</button>
</div>

<div class="container">
  <div class="card">
    <div class="word" id="word">等待加载单词</div>
    <div class="meaning-tag" id="meaning">--</div>
    <div class="sentence-en" id="senEn">--</div>
    <div class="sentence-cn" id="senCn">--</div>
  </div>

  <div class="setting-area">
    <div class="set-row">
      <span>间隔（秒）：</span>
      <input type="number" id="interval" value="4" min="1">
    </div>
    <div class="set-row">
      <span>单词朗读次数：</span>
      <input type="number" id="enReadCount" value="2" min="1">
    </div>
    <div class="set-row">
      <span>朗读速率：</span>
      <input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1">
    </div>
    <div class="switch-wrap">
      <div class="switch-item">
        <div class="switch" id="randomSwitch"></div>
        <span>随机顺序</span>
      </div>
      <div class="switch-item">
        <div class="switch active" id="readEnSwitch"></div>
        <span>朗读英文</span>
      </div>
      <div class="switch-item">
        <div class="switch" id="readMeanSwitch"></div>
        <span>朗读释义</span>
      </div>
      <div class="switch-item">
        <div class="switch active" id="readSenSwitch"></div>
        <span>朗读例句</span>
      </div>
    </div>
  </div>

  <div class="import-wrap">
    <label class="import-btn" for="fileInput">选择本地词库</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
</div>

<script>
let wordList = [];
let currentIndex = 0;
let running = false;
let isSpeaking = false;

// 词库配置：小学、初中、高中、四级、六级、考研、雅思
const dictConfig = [
  {
    name: "小学词汇",
    files: ["primarylist.json"]
  },
  {
    name: "初中词汇",
    files: ["juniorlist.json"]
  },
  {
    name: "高中词汇",
    files: ["seniorlist.json"]
  },
  {
    name: "四级词汇 4000词（单文件）",
    files: ["cet4list.json"]
  },
  {
    name: "六级词汇",
    files: ["cet6list.json"]
  },
  {
    name: "考研词汇",
    files: ["kaoyanlist.json"]
  },
  {
    name: "雅思词汇",
    files: ["ieltslist.json"]
  }
];

const domWord = document.getElementById('word');
const domMean = document.getElementById('meaning');
const domSenEn = document.getElementById('senEn');
const domSenCn = document.getElementById('senCn');
const intervalInput = document.getElementById('interval');
const enReadCountInput = document.getElementById('enReadCount');
const speechRateInput = document.getElementById('speechRate');
const dictSelect = document.getElementById('dictSelect');
const progressText = document.getElementById('progressText');
const jumpIndex = document.getElementById('jumpIndex');

// 开关DOM
const randomSwitch = document.getElementById('randomSwitch');
const readEnSwitch = document.getElementById('readEnSwitch');
const readMeanSwitch = document.getElementById('readMeanSwitch');
const readSenSwitch = document.getElementById('readSenSwitch');

// 填充下拉选项
dictConfig.forEach((item, idx)=>{
  const opt = document.createElement('option');
  opt.value = idx;
  opt.innerText = item.name;
  dictSelect.appendChild(opt);
})

// 开关点击事件
randomSwitch.onclick = ()=> randomSwitch.classList.toggle("active");
readEnSwitch.onclick = ()=> readEnSwitch.classList.toggle("active");
readMeanSwitch.onclick = ()=> readMeanSwitch.classList.toggle("active");
readSenSwitch.onclick = ()=> readSenSwitch.classList.toggle("active");

// 更新进度文字 & 保存当前索引（每个词库独立保存断点）
function updateProgress(){
  progressText.innerText = `进度：${currentIndex+1} / ${wordList.length}`;
  const selectIdx = Number(dictSelect.value);
  localStorage.setItem(`memIndex_${selectIdx}`, currentIndex);
}

// 加载选中词库
document.getElementById('loadOnline').onclick = async ()=>{
  const selectIdx = Number(dictSelect.value);
  const dictItem = dictConfig[selectIdx];
  const fileList = dictItem.files;
  let mergedWords = [];
  try{
    for(const filename of fileList){
      const res = await fetch(`./${filename}`);
      const arr = await res.json();
      mergedWords = mergedWords.concat(arr);
    }
    wordList = mergedWords;
    // 读取该词库上次背诵位置
    const saved = localStorage.getItem(`memIndex_${selectIdx}`);
    if(saved !== null){
      currentIndex = Math.min(Number(saved), wordList.length -1);
    }else{
      currentIndex = 0;
    }
    updateProgress();
    showWord(wordList[currentIndex]);
    alert(`词库【${dictItem.name}】加载完成，一共${wordList.length}个单词\n上次背到第${currentIndex+1}个`);
  }catch(e){
    console.error(e);
    alert("加载失败，请确认文件存在！\n文件列表："+fileList.join(","));
  }
}

// 跳转按钮
document.getElementById('jumpBtn').onclick = function(){
  const num = Number(jumpIndex.value);
  if(wordList.length ===0){alert("请先加载词库");return;}
  if(num <1 || num > wordList.length){alert("超出范围");return;}
  currentIndex = num -1;
  updateProgress();
  showWord(wordList[currentIndex]);
}

// 本地导入json
document.getElementById('fileInput').onchange = function(e){
  const reader = new FileReader();
  reader.onload = evt=>{
    const data = JSON.parse(evt.target.result);
    wordList = data;
    currentIndex = 0;
    updateProgress();
    showWord(wordList[currentIndex]);
    alert(`本地词库加载成功，共${wordList.length}个单词`);
  }
  reader.readAsText(e.target.files[0]);
}

function sleep(ms){
  return new Promise(res=>setTimeout(res,ms));
}

// 语音朗读
async function speakText(text, lang="en-US"){
  if(!text) return;
  while(isSpeaking) await sleep(100);
  isSpeaking = true;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = Number(speechRateInput.value) || 1;
  await new Promise(resolve => {
    utter.onend = ()=>{
      isSpeaking = false;
      resolve();
    };
    speechSynthesis.speak(utter);
  });
}

async function speakWordAudio(item){
  const readTimes = Number(enReadCountInput.value) || 2;
  //朗读单词
  if(readEnSwitch.classList.contains("active")){
    for(let i=0; i<readTimes; i++){
      await speakText(item.word, "en-US");
    }
  }
  //朗读释义
  if(readMeanSwitch.classList.contains("active") && item.mean){
    await speakText(item.mean, "zh-CN");
  }
  //朗读例句
  if(readSenSwitch.classList.contains("active") && item.sentenceEn){
    await speakText(item.sentenceEn, "en-US");
    if(item.sentenceCn) await speakText(item.sentenceCn, "zh-CN");
  }
}

async function showWord(item){
  domWord.innerText = item.word;
  domMean.innerText = item.mean || "";
  domSenEn.innerText = item.sentenceEn || "";
  domSenCn.innerText = item.sentenceCn || "";
  await speakWordAudio(item);
  if(running){
    await sleep(Number(intervalInput.value)*1000);
    next();
  }
}

function next(){
  if(!running) return;
  if(randomSwitch.classList.contains("active")){
    currentIndex = Math.floor(Math.random() * wordList.length);
  }else{
    currentIndex = (currentIndex+1) % wordList.length;
  }
  updateProgress();
  showWord(wordList[currentIndex]);
}

document.getElementById('startBtn').onclick = function(){
  if(wordList.length ===0){alert("请先加载词库！");return;}
  running=true;
  next();
}
document.getElementById('stopBtn').onclick = function(){
  running = false;
  speechSynthesis.cancel();
  isSpeaking = false;
}
</script>
</body>
</html>
