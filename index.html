<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>小张刷英语 · 奶油治愈版</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, .catalog-item, .switch, .catalog-header {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

/* ===== 奶油底色 ===== */
body{
  min-height: 100vh;
  background: #fdf8f1;                       /* 奶白 */
  color: #5a5047;
  position: relative;
  overflow-x: hidden;
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-top: env(safe-area-inset-top, 0px);
}

/* 背景柔光晕染 */
body::before{
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 12% 8%, rgba(255, 224, 200, 0.55) 0%, transparent 38%),
    radial-gradient(circle at 88% 18%, rgba(230, 220, 255, 0.45) 0%, transparent 38%),
    radial-gradient(circle at 50% 100%, rgba(255, 240, 220, 0.6) 0%, transparent 45%);
  pointer-events: none;
  z-index: 0;
}

/* 治愈系小圆点氛围（纯装饰，不挡字） */
.deco{
  position: fixed;
  z-index: 1;
  pointer-events: none;
  user-select: none;
  opacity: 0.5;
}
.deco-1{ top: 18px; left: 16px; font-size: 16px; }
.deco-2{ top: 20px; right: 18px; font-size: 16px; }
.deco-3{ top: 44%; left: 8px; font-size: 14px; opacity: 0.35; }
.deco-4{ top: 52%; right: 8px; font-size: 14px; opacity: 0.35; }
.deco-5{ bottom: 34px; left: 14px; font-size: 16px; opacity: 0.4; }
.deco-6{ bottom: 34px; right: 14px; font-size: 16px; opacity: 0.4; }

/* ===== 顶部标题 ===== */
.top-title{
  position: relative; z-index: 2;
  text-align: center;
  padding: 28px 16px 4px;
}
.top-title h2{
  font-size: 19px;
  font-weight: 600;
  color: #7a6a5a;
  letter-spacing: 1px;
}
.progress-text{
  margin-top: 8px;
  font-size: 13px;
  color: #b0a396;
  letter-spacing: 0.5px;
}

/* ===== 控制区 ===== */
.ctrl{
  position: relative; z-index: 2;
  display: flex; flex-direction: column; gap: 12px;
  align-items: center;
  margin: 18px 16px 22px;
}
.ctrl-row{
  display: flex; gap: 10px; flex-wrap: wrap;
  justify-content: center; align-items: center;
}
#dictSelect{
  padding: 11px 20px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  background: #fffaf3;
  color: #7a6a5a;
  box-shadow: 0 2px 10px rgba(210, 190, 165, 0.18);
  outline: none;
}
.jump-area{ display: flex; gap: 8px; align-items: center; }
#jumpIndex{
  width: 74px;
  padding: 11px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  text-align: center;
  background: #fffaf3;
  color: #7a6a5a;
  box-shadow: 0 2px 10px rgba(210, 190, 165, 0.18);
  outline: none;
}
#jumpIndex::placeholder{ color: #c8bbac; font-size: 12px; }

button{
  border: none;
  padding: 11px 22px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
}
button:active{ transform: scale(0.95); filter: brightness(0.98); }

/* 奶油配色按钮 */
.btn-blue{   background:#e5eefb; color:#5a6f8a; }   /* 奶油蓝 */
.btn-pink{   background:#fbe4ea; color:#a87080; }   /* 奶油粉 */
.btn-green{  background:#e2f0e6; color:#5f8568; }   /* 奶油绿 */
.btn-orange{ background:#fbeeda; color:#a8885a; }   /* 奶油橘 */
.btn-purple{ background:#ebe4f7; color:#7a6a9a; }   /* 奶油紫 */
.btn-red{    background:#fae2e2; color:#a87070; }   /* 奶油红 */
.btn-soft{   background:#f4ede2; color:#8a7a68; }   /* 奶油咖 */
button:disabled{ opacity:0.5; pointer-events:none; }
button.speaking{ opacity:0.55; pointer-events:none; }

/* ===== 内容容器 ===== */
.container{
  position: relative; z-index: 2;
  padding: 0 16px; max-width: 600px; margin: 0 auto;
}
.card{
  background: #ffffff;
  border-radius: 32px;
  padding: 42px 24px 28px;
  text-align: center;
  box-shadow:
    0 12px 32px rgba(210, 190, 165, 0.16),
    0 2px 6px rgba(210, 190, 165, 0.06);
  position: relative;
  z-index: 2;
  border: 1px solid rgba(255, 250, 240, 0.9);
}

/* 卡片淡入淡出 */
.card-content{ transition: opacity 0.22s ease, transform 0.22s ease; }
.card-content.fade-out{ opacity: 0; transform: translateY(6px); }
.card-content.fade-in{ opacity: 1; transform: translateY(0); }

/* 查看次数徽章 */
.view-badge{
  position: absolute; top: 12px; right: 18px;
  background: #fff2e6;
  color: #a8885a;
  font-size: 12px; font-weight: 600;
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid #fde8d4;
  display: flex; align-items: center; gap: 4px;
  z-index: 3;
  transition: all 0.3s;
}
.view-badge .num{ font-size: 13px; color: #c89468; font-weight: 800; }
.view-badge.high{
  background: #fbe4ea; color: #a87080;
  border-color: #f7d0da;
}
.view-badge.high .num{ color: #c87790; }

/* 单词 */
.word{
  font-size: 46px;
  font-weight: 800;
  color: #6a5a4a;
  margin-bottom: 14px;
  letter-spacing: -0.5px;
  word-break: break-word;
  line-height: 1.15;
}
.word.waiting{
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 1.2px;
  line-height: 1.6;
  color: #b8a8c8;
  font-family: "Snell Roundhand", "Apple Chancery", "Brush Script MT", "Segoe Script", cursive;
  padding: 14px 0;
}

/* 释义胶囊 */
.meaning-tag{
  display: inline-block;
  background: #f4ede2;
  color: #7a6a5a;
  font-size: 16px;
  font-weight: 600;
  padding: 9px 22px;
  border-radius: 999px;
  margin-bottom: 24px;
  letter-spacing: 0.3px;
}

.sentence-en{
  font-size: 16px;
  color: #6a5a4a;
  line-height: 1.7;
  margin-bottom: 8px;
}
.sentence-cn{
  font-size: 14px;
  color: #a8988a;
  line-height: 1.6;
}

/* 上一个/下一个 */
.nav-buttons{
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 28px;
}
.nav-buttons button{
  padding: 12px 26px;
  font-size: 14px;
  flex: 0 1 auto;
}

/* ===== 复习快捷栏 ===== */
.review-bar{
  margin-top: 18px;
  background: #ffffff;
  border-radius: 24px;
  padding: 16px 18px;
  box-shadow: 0 8px 24px rgba(210, 190, 165, 0.12);
  position: relative; z-index: 2;
  border: 1px solid rgba(255, 250, 240, 0.9);
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; justify-content: center;
}
.review-bar .label{
  font-size: 13px;
  color: #b0a396;
  font-weight: 600;
  margin-right: 4px;
  letter-spacing: 0.5px;
}
.review-bar button{
  padding: 9px 16px;
  font-size: 12px;
  font-weight: 600;
}
.review-bar .hint{
  font-size: 11px;
  color: #b8b0a4;
  width: 100%;
  text-align: center;
  margin-top: 6px;
  letter-spacing: 0.3px;
}

/* ===== 设置区 ===== */
.setting-area{
  margin-top: 18px;
  background: #ffffff;
  border-radius: 24px;
  padding: 18px 22px;
  box-shadow: 0 8px 24px rgba(210, 190, 165, 0.12);
  position: relative; z-index: 2;
  border: 1px solid rgba(255, 250, 240, 0.9);
}
.set-row{
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 0; font-size: 14px; color: #8a7a68;
  letter-spacing: 0.3px;
}
.set-row input[type="number"]{
  width: 66px;
  padding: 8px;
  border-radius: 12px;
  border: 1px solid #f0e6d8;
  background: #fffaf3;
  text-align: center;
  font-size: 14px;
  color: #7a6a5a;
  outline: none;
}
.switch-wrap{
  display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px;
}
.switch-item{
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: #8a7a68;
}
.switch{
  position: relative;
  width: 42px; height: 24px;
  background: #ece2d2;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.3s;
}
.switch::after{
  content: "";
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
  box-shadow: 0 2px 4px rgba(180, 160, 140, 0.2);
}
.switch.active{ background: #c9d8e8; }
.switch.active::after{ left: 21px; }

/* ===== 导入区 ===== */
.import-wrap{
  margin-top: 22px; text-align: center;
  position: relative; z-index: 2;
}
.import-btn{
  display: inline-block;
  padding: 13px 30px;
  background: #fff2e6;
  color: #a8885a;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
  font-size: 13px;
  letter-spacing: 0.5px;
  border: 1px solid #fde8d4;
  box-shadow: 0 4px 12px rgba(210, 190, 165, 0.15);
}
#fileInput{ display: none; }
#loadStatus{
  font-size: 12px; color: #b8b0a4;
  margin-top: 10px; min-height: 16px;
  letter-spacing: 0.3px;
}

/* ===== 可折叠目录面板 ===== */
.catalog-panel{
  margin-top: 18px;
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 8px 24px rgba(210, 190, 165, 0.12);
  position: relative; z-index: 2;
  border: 1px solid rgba(255, 250, 240, 0.9);
  overflow: hidden;
}
.catalog-header{
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  cursor: pointer; user-select: none;
  transition: background 0.2s;
}
.catalog-header:hover{ background: #fffaf3; }
.catalog-header .title{
  font-weight: 600; font-size: 14px; color: #8a7a68;
  display: flex; align-items: center; gap: 6px;
  letter-spacing: 0.3px;
}
.catalog-header .meta{ font-size: 12px; color: #b8b0a4; font-weight: normal; }
.catalog-header .toggle-icon{
  font-size: 11px; color: #c8bbac;
  transition: transform 0.3s; margin-left: 8px;
}
.catalog-panel.open .catalog-header .toggle-icon{ transform: rotate(180deg); }

.catalog-body{
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s ease, padding 0.35s ease;
  padding: 0 22px;
}
.catalog-panel.open .catalog-body{
  max-height: 420px; overflow-y: auto;
  padding: 0 22px 18px;
}

/* 目录项：圆角正方形 */
.catalog-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px;
}
.catalog-item{
  background: #fdf8f1;
  border-radius: 18px;
  padding: 14px 8px 12px;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  border: 1px solid #f2e8d8;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 90px;
  position: relative;
  text-align: center;
  overflow: hidden;
}
.catalog-item .word-en{
  font-size: 13px;
  font-weight: 700;
  color: #6a5a4a;
  line-height: 1.25;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 5px;
  max-width: 100%;
}
.catalog-item .word-cn{
  font-size: 10px;
  color: #b0a396;
  line-height: 1.3;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 100%;
}
.catalog-item .badge{
  position: absolute;
  top: 6px; right: 6px;
  background: #fbe4ea;
  color: #a87080;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  padding: 0 5px;
  border-radius: 999px;
}
.catalog-item:hover{
  background: #faf0e2;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(210, 190, 165, 0.18);
}
.catalog-item:active{
  background: #f5e8d8 !important;
  transform: scale(0.96);
}
.catalog-item.active{
  background: linear-gradient(135deg, #f4e4d4, #eaddd0);
  border-color: #e5d4c0;
  box-shadow: 0 4px 14px rgba(210, 180, 145, 0.3);
}
.catalog-item.active .word-en{ color: #6a4a3a; }
.catalog-item.active .word-cn{ color: #a08a78; }
.catalog-item.active .badge{ background: #fff; color: #a87080; }
.catalog-empty{
  color: #c8bbac;
  font-size: 12px;
  padding: 16px 0;
  text-align: center;
  grid-column: 1 / -1;
  letter-spacing: 0.3px;
}

/* ===== 深色模式（奶咖夜） ===== */
@media (prefers-color-scheme: dark) {
  body{ background: #2a2620; color: #d8cfc2; }
  body::before{
    background:
      radial-gradient(circle at 12% 8%, rgba(120, 90, 70, 0.35) 0%, transparent 38%),
      radial-gradient(circle at 88% 18%, rgba(90, 80, 110, 0.35) 0%, transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(100, 80, 60, 0.4) 0%, transparent 45%);
  }
  .top-title h2{ color: #e0d5c4; }
  .progress-text{ color: #9a8f80; }
  .card, .setting-area, .catalog-panel, .review-bar{
    background: #3a342c;
    border-color: rgba(255, 240, 220, 0.06);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
  }
  .word{ color: #f0e6d8; }
  .word.waiting{ color: #b8a8c8; }
  .meaning-tag{ background: #4a4238; color: #d8cfc2; }
  .sentence-en{ color: #d8cfc2; }
  .sentence-cn{ color: #a89c8c; }
  .catalog-item{ background: #443c32; border-color: #544a3e; }
  .catalog-item .word-en{ color: #e0d5c4; }
  .catalog-item .word-cn{ color: #a89c8c; }
  .catalog-item:hover{ background: #4e4438; }
  .catalog-item:active{ background: #5a4f42 !important; }
  .catalog-item.active{
    background: linear-gradient(135deg, #5e5145, #6a5c4e);
    border-color: #7a6a5a;
  }
  .set-row{ color: #c8bfb0; }
  .set-row input[type="number"]{ background: #4a4238; border-color: #5a5044; color: #d8cfc2; }
  .switch-item{ color: #a89c8c; }
  .switch{ background: #4a4238; }
  .switch.active{ background: #6a7a8a; }
  #dictSelect, #jumpIndex{ background: #4a4238; color: #d8cfc2; }
  .catalog-header .title{ color: #c8bfb0; }
  .catalog-header:hover{ background: #443c32; }
  .review-bar .label{ color: #a89c8c; }
  .review-bar .hint{ color: #8a7f70; }
  .btn-blue{ background:#3a4a5a; color:#b8c8d8; }
  .btn-pink{ background:#4a3a42; color:#d8b8c4; }
  .btn-green{ background:#3a4a3e; color:#b8d8c0; }
  .btn-orange{ background:#4a4232; color:#d8c8a8; }
  .btn-purple{ background:#3e3a4a; color:#c8b8d8; }
  .btn-red{ background:#4a3a3a; color:#d8b8b8; }
  .btn-soft{ background:#3e3a34; color:#c8bfb0; }
  .import-btn{ background:#4a4232; color:#d8c8a8; border-color:#5a5040; }
  .view-badge{ background:#4a4238; color:#d8c8a8; border-color:#5a5044; }
  .view-badge .num{ color:#e8c898; }
  .view-badge.high{ background:#4a3a42; color:#d8b8c4; border-color:#5a4a52; }
  .view-badge.high .num{ color:#e8a8c0; }
}
</style>
</head>
<body>

<!-- 治愈系小点缀（纯装饰） -->
<div class="deco deco-1">🌿</div>
<div class="deco deco-2">🌙</div>
<div class="deco deco-3">☁️</div>
<div class="deco deco-4">🫧</div>
<div class="deco deco-5">🌾</div>
<div class="deco deco-6">🍃</div>

<div class="top-title">
  <h2>📖 小张刷英语</h2>
  <div class="progress-text" id="progressText">进度：0 / 0</div>
</div>

<div class="ctrl">
  <div class="ctrl-row">
    <select id="dictSelect"></select>
    <button class="btn-blue" id="loadOnline">加载词库</button>
  </div>
  <div class="ctrl-row">
    <div class="jump-area">
      <input type="number" id="jumpIndex" placeholder="跳至...">
      <button class="btn-orange" id="jumpBtn">跳转</button>
    </div>
    <button class="btn-pink" id="startBtn">▶ 开始</button>
    <button class="btn-green" id="stopBtn">⏸ 暂停</button>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="view-badge" id="viewBadge">已看 <span class="num" id="viewCount">0</span> 次</div>

    <div class="card-content" id="cardContent">
      <div class="word waiting" id="word">𝓈𝑜𝒻𝓉 𝓈𝓊𝓂𝓂𝑒𝓇 𝓃𝑒𝓋𝑒𝓇 𝒻𝒶𝒹𝑒𝓈</div>
      <div class="meaning-tag" id="meaning">--</div>
      <div class="sentence-en" id="senEn">--</div>
      <div class="sentence-cn" id="senCn">--</div>
    </div>

    <div class="nav-buttons">
      <button class="btn-purple" id="prevBtn">◀ 上一个</button>
      <button class="btn-purple" id="nextBtn">下一个 ▶</button>
    </div>
  </div>

  <div class="review-bar">
    <span class="label">🔍 复习</span>
    <button class="btn-blue" id="reviewLeast">最不熟</button>
    <button class="btn-orange" id="reviewMost">最熟</button>
    <button class="btn-green" id="reviewUnseen">没看过</button>
    <button class="btn-soft" id="resetViewCount">清零</button>
    <div class="hint" id="reviewHint">「最不熟」= 查看次数最少的单词</div>
  </div>

  <div class="catalog-panel" id="catalogPanel">
    <div class="catalog-header" id="catalogHeader">
      <span class="title">📂 单词目录 <span class="meta" id="catalogCount">0 个单词</span></span>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="catalog-body">
      <div class="catalog-grid" id="catalogGrid">
        <div class="catalog-empty">加载词库后显示目录</div>
      </div>
    </div>
  </div>

  <div class="setting-area">
    <div class="set-row">
      <span>间隔（秒）：</span>
      <input type="number" id="interval" value="4" min="1">
    </div>
    <div class="set-row">
      <span>单词朗读次数：</span>
      <input type="number" id="enReadCount" value="2" min="1">
    </div>
    <div class="set-row">
      <span>朗读速率：</span>
      <input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1">
    </div>
    <div class="switch-wrap">
      <div class="switch-item">
        <div class="switch active" id="readEnSwitch"></div>
        <span>英文</span>
      </div>
      <div class="switch-item">
        <div class="switch" id="readMeanSwitch"></div>
        <span>释义</span>
      </div>
      <div class="switch-item">
        <div class="switch active" id="readSenSwitch"></div>
        <span>例句</span>
      </div>
    </div>
  </div>

  <div class="import-wrap">
    <label class="import-btn" for="fileInput">📁 选择本地词库</label>
    <input type="file" id="fileInput" accept=".json" multiple>
    <div id="loadStatus"></div>
  </div>
</div>

<script>
// ================= 全局状态 =================
let wordList = [];
let currentIndex = 0;
let running = false;
let isSpeaking = false;
let speechToken = 0;
let displaySession = 0;
let switching = false;

let viewCountMap = {};
let currentSortMode = 'default';
let onlyUnseen = false;

let isLoading = false;
let lastClickTime = 0;
const CLICK_DELAY = 500;

const VIEW_COUNT_KEY = 'wordViewCounts_v1';

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.interval) intervalInput.value = s.interval;
    if (s.enReadCount) enReadCountInput.value = s.enReadCount;
    if (s.speechRate) speechRateInput.value = s.speechRate;
