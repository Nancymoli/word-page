<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小张刷英语 · CET4</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    color: #2b3445;
    background:
      radial-gradient(320px 240px at 10% -10%, #cde8ff 0%, rgba(205, 232, 255, 0) 60%),
      radial-gradient(340px 260px at 110% 110%, #ffd6e8 0%, rgba(255, 214, 232, 0) 55%),
      linear-gradient(180deg, #f7fcff 0%, #ffffff 45%, #fff7fb 100%);
    position: relative;
    overflow-x: hidden;
  }

  /* 极低对比背景泡泡，只做氛围 */
  body::before,
  body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    width: 180px;
    height: 180px;
    background: rgba(180, 220, 255, 0.35);
    filter: blur(40px);
    top: 40px;
    left: -60px;
  }

  body::after {
    width: 210px;
    height: 210px;
    background: rgba(255, 200, 225, 0.35);
    filter: blur(44px);
    bottom: 80px;
    right: -80px;
  }

  /* 页面容器：严格单列居中 */
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 18px 32px;
    position: relative;
    z-index: 2;
  }

  /* 通用毛玻璃卡片 */
  .glass-card {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 28px;
    box-shadow:
      0 10px 30px rgba(180, 210, 255, 0.18),
      0 4px 10px rgba(255, 195, 220, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    padding: 20px;
    margin-bottom: 18px;
  }

  /* 顶部标题栏 */
  .top-bar {
    text-align: center;
    padding: 14px 18px;
  }

  .top-bar h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #2b3445;
  }

  /* 按钮组 */
  .button-group {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 10px 24px rgba(120, 170, 240, 0.32);
  }

  .btn:active {
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(120, 170, 240, 0.28);
  }

  .btn-blue {
    background: linear-gradient(135deg, #b7dcff 0%, #77adf7 100%);
  }

  .btn-pink {
    background: linear-gradient(135deg, #ffc1d3 0%, #ff8faa 100%);
  }

  .btn-green {
    background: linear-gradient(135deg, #bcecd7 0%, #7fd7b5 100%);
  }

  /* 单词卡片 */
  .word-card {
    padding: 36px 24px;
    text-align: center;
  }

  .word {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #2b3445;
    margin-bottom: 8px;
  }

  .phonetic {
    font-size: 19px;
    color: #7f8fa6;
    margin-bottom: 14px;
  }

  .explain {
    display: inline-block;
    background: linear-gradient(135deg, #d7ecff 0%, #b0e0ff 100%);
    color: #2b6ca3;
    font-size: 21px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 999px;
    margin-bottom: 20px;
    box-shadow: 0 8px 18px rgba(120, 170, 240, 0.28);
  }

  .sentenceEn {
    font-size: 19px;
    color: #444957;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .sentenceCn {
    font-size: 18px;
    color: #5c6270;
  }

  /* 设置面板 */
  .settings {
    padding: 22px;
  }

  .set-row {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 15px;
    color: #444;
  }

  .set-row:last-child {
    margin-bottom: 0;
  }

  .set-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  input[type="number"] {
    border: 1px solid #ffd8e4;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 999px;
    padding: 8px 12px;
    width: 86px;
    text-align: center;
    font-size: 15px;
    outline: none;
    color: #444;
  }

  /* 软开关 */
  .switch {
    position: relative;
    display: inline-block;
    width: 56px;
    height: 28px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ffd7e3;
    border-radius: 999px;
    transition: 0.25s ease;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
  }

  .slider:before {
    content: "";
    position: absolute;
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.25s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  }

  input:checked + .slider {
    background: linear-gradient(135deg, #ffb6c8, #ff8fab);
  }

  input:checked + .slider:before {
    transform: translateX(28px);
  }

  /* 文件按钮 */
  .file-area {
    text-align: center;
    margin-top: 4px;
  }

  .file-label {
    display: inline-block;
    background: linear-gradient(135deg, #b5ddff, #89c6f8);
    color: #2b6ca3;
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(120, 170, 240, 0.3);
  }

  input[type="file"] {
    display: none;
  }

  textarea {
    display: none;
  }

  /* 登录弹窗 */
  .login-box {
    position: fixed;
    inset: 0;
    background: rgba(255, 247, 251, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
    backdrop-filter: blur(8px);
  }

  .login-inner {
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(12px);
    padding: 28px;
    border-radius: 32px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 16px 40px rgba(255, 150, 180, 0.28);
    text-align: center;
  }

  .login-inner h3 {
    margin-bottom: 16px;
    color: #2b3445;
  }

  #pwdInput {
    width: 100%;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid #ffd8e4;
    outline: none;
    margin-bottom: 12px;
    font-size: 15px;
  }

  #loginTip {
    color: #ff6b6b;
    font-size: 14px;
    margin-bottom: 10px;
    min-height: 20px;
  }

  .main-page {
    display: none;
  }
</style>
</head>

<body>
  <div class="login-box" id="loginBox">
    <div class="login-inner">
      <h3>🔐 请输入访问密码</h3>
      <input type="password" id="pwdInput" placeholder="输入密码" />
      <div id="loginTip"></div>
      <button id="loginBtn" class="btn btn-pink" style="width:100%">确认进入</button>
    </div>
  </div>

  <div class="page main-page" id="mainPage">
    <div class="glass-card top-bar">
      <h1>📖 小张刷英语 · CET4</h1>
    </div>

    <div class="button-group">
      <button id="loadOnline" class="btn btn-blue">加载四级词库（联网）</button>
      <button id="startBtn" class="btn btn-pink">开始刷词</button>
      <button id="stopBtn" class="btn btn-green">暂停</button>
    </div>

    <textarea id="wordListInput"></textarea>

    <div class="glass-card word-card" id="wordCard">
      <div class="word" id="word"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="explain" id="explain"></div>
      <div class="sentenceEn" id="sentenceEn"></div>
      <div class="sentenceCn" id="sentenceCn"></div>
    </div>

    <div class="glass-card settings">
      <div class="set-row">
        <label>间隔（秒）：<input type="number" id="interval" value="4" min="1" /></label>
        <label>单词朗读次数：<input type="number" id="repeatEnTimes" value="2" min="1" /></label>
        <label>朗读速率：<input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1" /></label>
      </div>

      <div class="set-row">
        <label class="switch">
          <input type="checkbox" id="random" />
          <span class="slider"></span>
        </label>
        <span>随机顺序</span>

        <label class="switch">
          <input type="checkbox" id="readEn" checked />
          <span class="slider"></span>
        </label>
        <span>朗读英文</span>

        <label class="switch">
          <input type="checkbox" id="readCn" checked />
          <span class="slider"></span>
        </label>
        <span>朗读释义</span>

        <label class="switch">
          <input type="checkbox" id="readSentence" />
          <span class="slider"></span>
        </label>
        <span>朗读例句</span>
      </div>
    </div>

    <div class="file-area">
      <label class="file-label" for="fileInput">选择本地词库文件</label>
      <input type="file" id="fileInput" accept=".txt,.json" />
    </div>
  </div>

<script>
const loginBox = document.getElementById('loginBox');
const mainPage = document.getElementById('mainPage');
const pwdInput = document.getElementById('pwdInput');
const loginBtn = document.getElementById('loginBtn');
const loginTip = document.getElementById('loginTip');

loginBtn.onclick = checkPassword;
pwdInput.onkeydown = function(e){
  if(e.key === 'Enter') checkPassword();
};

async function checkPassword(){
  const inputPwd = pwdInput.value.trim();
  loginBtn.disabled = true;
  loginBtn.innerText = "验证中...";
  loginTip.innerText = "";
  try{
    const res = await fetch("/.netlify/functions/login",{
      method:"POST",
      body:JSON.stringify({pwd:inputPwd})
    });
    const data = await res.json();
    if(data.success){
      loginBox.style.display = 'none';
      mainPage.style.display = 'block';
    }else{
      loginTip.innerText = "密码错误，请重新输入";
      pwdInput.value = '';
    }
  }catch(err){
    loginTip.innerText = "网络验证失败";
    console.error(err);
  }
  loginBtn.disabled = false;
  loginBtn.innerText = "确认进入";
}

let wordList = [];
let currentIndex = 0;
let running = false;

const wordDom = document.getElementById('word');
const phoneticDom = document.getElementById('phonetic');
const explainDom = document.getElementById('explain');
const sentenceEnDom = document.getElementById('sentenceEn');
const sentenceCnDom = document.getElementById('sentenceCn');
const intervalInput = document.getElementById('interval');
const randomCheck = document.getElementById('random');
const readEnCheck = document.getElementById('readEn');
const readCnCheck = document.getElementById('readCn');
const readSentenceCheck = document.getElementById('readSentence');
const repeatEnInput = document.getElementById('repeatEnTimes');
const rateInput = document.getElementById('speechRate');

document.getElementById('loadOnline').onclick = async function(){
  try{
    const res = await fetch('cet4.json');
    wordList = await res.json();
    currentIndex = 0;
    alert("词库加载完成！一共"+wordList.length+"个单词");
  }catch(e){
    console.error(e);
    alert("在线加载失败，请确认cet4.json已上传到仓库根目录");
  }
};

document.getElementById('fileInput').onchange = function(e){
  const reader = new FileReader();
  reader.onload = function(event){
    const text = event.target.result;
    try{
      wordList = JSON.parse(text);
    }catch(err){
      parseWords(text);
    }
    alert("本地词库加载完成！一共"+wordList.length+"个单词");
  };
  reader.readAsText(e.target.files[0]);
};

function parseWords(text){
  const lines = text.split(/\r?\n/).filter(line=>line.trim()!=="");
  wordList = [];
  for(let line of lines){
    const reg = /^(.+?)\s+(\[.+?\])\s+(.+)$/;
    const match = line.match(reg);
    if(match){
      wordList.push({
        word:match[1],
        phonetic:match[2],
        mean:match[3],
        sentenceEn:"",
        sentenceCn:""
      });
    }
  }
  currentIndex = 0;
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function speakWord(item){
  const synth = window.speechSynthesis;
  synth.cancel();
  const rate = Number(rateInput.value);

  if(readEnCheck.checked && item.word){
    const times = Number(repeatEnInput.value);
    for(let i=0;i<times;i++){
      await new Promise(resolve=>{
        const utter = new SpeechSynthesisUtterance(item.word);
        utter.lang = "en-US";
        utter.rate = rate;
        utter.onend = resolve;
        synth.speak(utter);
      });
      await sleep(300);
    }
    await sleep(500);
  }

  if(readCnCheck.checked && item.mean){
    await new Promise(resolve=>{
      const utterCn = new SpeechSynthesisUtterance(item.mean);
      utterCn.lang = "zh-CN";
      utterCn.rate = rate;
      utterCn.onend = resolve;
      synth.speak(utterCn);
    });
    await sleep(500);
  }

  if(readSentenceCheck.checked){
    if(item.sentenceEn){
      await new Promise(resolve=>{
        const utterSenEn = new SpeechSynthesisUtterance(item.sentenceEn);
        utterSenEn.lang = "en-US";
        utterSenEn.rate = rate;
        utterSenEn.onend = resolve;
        synth.speak(utterSenEn);
      });
      await sleep(400);
    }
    if(item.sentenceCn){
      await new Promise(resolve=>{
        const utterSenCn = new SpeechSynthesisUtterance(item.sentenceCn);
        utterSenCn.lang = "zh-CN";
        utterSenCn.rate = rate;
        utterSenCn.onend = resolve;
        synth.speak(utterSenCn);
      });
    }
  }
}

async function showWord(item){
  wordDom.innerText = item.word || "";
  phoneticDom.innerText = item.phonetic || "";
  explainDom.innerText = item.mean || "";
  sentenceEnDom.innerText = item.sentenceEn || "";
  sentenceCnDom.innerText = item.sentenceCn || "";
  await speakWord(item);
  if(running){
    await sleep(Number(intervalInput.value)*1000);
    nextWord();
  }
}

function nextWord(){
  if(!running) return;
  if(randomCheck.checked){
    currentIndex = Math.floor(Math.random() * wordList.length);
  }else{
    currentIndex = (currentIndex + 1) % wordList.length;
  }
  showWord(wordList[currentIndex]);
}

document.getElementById('startBtn').onclick = function(){
  if(wordList.length === 0){
    alert("请先加载词库");
    return;
  }
  if(running) return;
  running = true;
  nextWord();
};

document.getElementById('stopBtn').onclick = function(){
  running = false;
  window.speechSynthesis.cancel();
};
</script>
</body>
</html>
