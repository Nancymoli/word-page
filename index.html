<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小张刷英语 · CET4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;padding:24px 16px;background:linear-gradient(180deg,#bce6ff 0%,#ffdde8 100%);position:relative;overflow-x:hidden}
.deco{position:absolute;pointer-events:none;z-index:1}
.deco-star1{top:55px;left:14px;width:60px;height:60px;background:#ffdd88;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.85}
.deco-star2{top:38px;right:22px;width:44px;height:44px;background:#a0d8ff;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.8}
.deco-heart{top:130px;right:14px;width:48px;height:44px;background:#ffb6c9;border-radius:50% 50% 0 0;transform:rotate(-45deg);opacity:.85}
.deco-heart::before,.deco-heart::after{content:"";position:absolute;width:48px;height:44px;background:#ffb6c9;border-radius:50%}
.deco-heart::before{top:-22px;left:0}
.deco-heart::after{left:22px;top:0}
.deco-book{bottom:150px;right:10px;width:56px;height:48px;background:#ffcde2;border-radius:10px;transform:rotate(-12deg);opacity:.85;box-shadow:inset -4px 0 0 #ffb3d4}
.container{max-width:720px;margin:0 auto;position:relative;z-index:2}
.top-bar{background:#fff;border-radius:999px;padding:14px 24px;text-align:center;margin-bottom:22px;box-shadow:0 6px 16px rgba(200,160,190,.2)}
.top-bar h1{font-size:22px;color:#333948;font-weight:700}
.control{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
button{border:none;border-radius:999px;padding:13px 20px;font-size:16px;font-weight:600;color:#fff;box-shadow:0 6px 14px rgba(120,170,240,.3);transition:.2s;cursor:pointer}
button:active{transform:scale(.96)}
.btn-blue{background:linear-gradient(135deg,#93c8ff,#70aef8)}
.btn-pink{background:linear-gradient(135deg,#ffb8c8,#ff96ab)}
.btn-green{background:linear-gradient(135deg,#b0e9d4,#82d8b8)}
.word-card{background:#fffefb;border-radius:48px 44px 50px 46px / 42px 46px 40px 48px;padding:44px 24px;text-align:center;position:relative;box-shadow:0 12px 30px rgba(180,150,180,.16);margin-bottom:20px}
.word{font-size:52px;font-weight:800;color:#2f3746;margin-bottom:8px}
.phonetic{font-size:20px;color:#606878;margin-bottom:14px}
.explain{font-size:22px;color:#444;margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed #d8c8d8;display:inline-block}
.sentenceEn{font-size:19px;color:#444957;margin-bottom:10px;line-height:1.5}
.sentenceCn{font-size:18px;color:#5c6270}
.settings{background:#fff;border-radius:32px;padding:20px;box-shadow:0 8px 20px rgba(180,150,180,.14);margin-bottom:16px}
.setting-row{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:14px;gap:12px;font-size:16px;color:#444}
.setting-row:last-child{margin-bottom:0}
.setting-row label{display:flex;align-items:center;gap:6px}
input[type="number"]{border:2px solid #ffd8e4;background:#fff;border-radius:999px;padding:8px 12px;width:90px;text-align:center;font-size:16px;outline:none}
.switch{position:relative;display:inline-block;width:56px;height:30px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#ffd7e3;border-radius:999px;transition:.3s}
.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.12)}
input:checked + .slider{background:#ff98ad}
input:checked + .slider:before{transform:translateX(26px)}
.file-wrap{text-align:center;margin-top:10px}
.file-label{display:inline-block;background:linear-gradient(135deg,#b5ddff,#89c6f8);color:#2b5c90;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 10px rgba(110,170,230,.25)}
input[type="file"]{display:none}
textarea{display:none}
.login-box{position:fixed;inset:0;background:rgba(255,220,235,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999;backdrop-filter:blur(6px)}
.login-inner{background:#fff;padding:28px;border-radius:32px;width:100%;max-width:340px;box-shadow:0 16px 36px rgba(255,150,180,.3);text-align:center}
.login-inner h3{margin-bottom:16px;color:#333948}
#pwdInput{width:100%;padding:12px 14px;border-radius:999px;border:2px solid #ffd8e4;outline:none;margin-bottom:12px;font-size:16px}
#loginTip{color:#ff6b6b;font-size:14px;margin-bottom:10px;min-height:20px}
.main-page{display:none}
</style>
</head>
<body>
<div class="deco deco-star1"></div>
<div class="deco deco-star2"></div>
<div class="deco deco-heart"></div>
<div class="deco deco-book"></div>

<div class="login-box" id="loginBox">
  <div class="login-inner">
    <h3>🔐 请输入访问密码</h3>
    <input type="password" id="pwdInput" placeholder="输入密码" />
    <div id="loginTip"></div>
    <button id="loginBtn" class="btn-pink" style="width:100%">确认进入</button>
  </div>
</div>

<div class="container main-page" id="mainPage">
  <div class="top-bar"><h1>📖 小张刷英语 · CET4</h1></div>
  <div class="control">
    <button id="loadOnline" class="btn-blue">加载四级词库</button>
    <button id="startBtn" class="btn-pink">开始刷词</button>
    <button id="stopBtn" class="btn-green">暂停</button>
  </div>
  <textarea id="wordListInput"></textarea>
  <div class="word-card" id="wordCard">
    <div class="word" id="word"></div>
    <div class="phonetic" id="phonetic"></div>
    <div class="explain" id="explain"></div>
    <div class="sentenceEn" id="sentenceEn"></div>
    <div class="sentenceCn" id="sentenceCn"></div>
  </div>
  <div class="settings">
    <div class="setting-row">
      <label>间隔（秒）：<input type="number" id="interval" value="4" min="1" /></label>
      <label>单词朗读次数：<input type="number" id="repeatEnTimes" value="2" min="1" /></label>
      <label>朗读速率：<input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1" /></label>
    </div>
    <div class="setting-row">
      <label class="switch"><input type="checkbox" id="random" /><span class="slider"></span></label><span>随机顺序</span>
      <label class="switch"><input type="checkbox" id="readEn" checked /><span class="slider"></span></label><span>朗读英文</span>
      <label class="switch"><input type="checkbox" id="readCn" checked /><span class="slider"></span></label><span>朗读释义</span>
      <label class="switch"><input type="checkbox" id="readSentence" /><span class="slider"></span></label><span>朗读例句</span>
    </div>
  </div>
  <div class="file-wrap">
    <label class="file-label" for="fileInput">选择本地词库文件</label>
    <input type="file" id="fileInput" accept=".txt,.json" />
  </div>
</div>

<script>
const loginBox=document.getElementById('loginBox'),mainPage=document.getElementById('mainPage'),pwdInput=document.getElementById('pwdInput'),loginBtn=document.getElementById('loginBtn'),loginTip=document.getElementById('loginTip');
loginBtn.onclick=checkPassword;pwdInput.onkeydown=function(e){if(e.key==='Enter')checkPassword()};
async function checkPassword(){
  const p=pwdInput.value.trim();loginBtn.disabled=true;loginBtn.innerText="验证中...";loginTip.innerText="";
  try{
    const res=await fetch("/.netlify/functions/login",{method:"POST",body:JSON.stringify({pwd:p})});
    const data=await res.json();
    if(data.success){loginBox.style.display='none';mainPage.style.display='block'}
    else{loginTip.innerText="密码错误，请重新输入";pwdInput.value=''}
  }catch(e){loginTip.innerText="网络验证失败";console.error(e)}
  loginBtn.disabled=false;loginBtn.innerText="确认进入";
}
let wordList=[],currentIndex=0,running=false;
const wordDom=document.getElementById('word'),phoneticDom=document.getElementById('phonetic'),explainDom=document.getElementById('explain'),sentenceEnDom=document.getElementById('sentenceEn'),sentenceCnDom=document.getElementById('sentenceCn'),intervalInput=document.getElementById('interval'),randomCheck=document.getElementById('random'),readEnCheck=document.getElementById('readEn'),readCnCheck=document.getElementById('readCn'),readSentenceCheck=document.getElementById('readSentence'),repeatEnInput=document.getElementById('repeatEnTimes'),rateInput=document.getElementById('speechRate');
document.getElementById('loadOnline').onclick=async function(){
  try{const res=await fetch('cet4.json');wordList=await res.json();currentIndex=0;alert("词库加载完成！一共"+wordList.length+"个单词")}
  catch(e){console.error(e);alert("在线加载失败，请确认cet4.json已上传")}
};
document.getElementById('fileInput').onchange=function(e){
  const reader=new FileReader();
  reader.onload=function(ev){const t=ev.target.result;try{wordList=JSON.parse(t)}catch(err){parseWords(t)}alert("本地词库加载完成！一共"+wordList.length+"个单词")};
  reader.readAsText(e.target.files[0]);
};
function parseWords(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=="");wordList=[];
  for(let line of lines){const m=line.match(/^(.+?)\s+(\[.+?\])\s+(.+)$/);if(m)wordList.push({word:m[1],phonetic:m[2],mean:m[3],sentenceEn:"",sentenceCn:""})}
  currentIndex=0;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function speakWord(item){
  const synth=window.speechSynthesis;synth.cancel();const rate=Number(rateInput.value);
  if(readEnCheck.checked&&item.word){
    const times=Number(repeatEnInput.value);
    for(let i=0;i<times;i++){await new Promise(r=>{const u=new SpeechSynthesisUtterance(item.word);u.lang="en-US";u.rate=rate;u.onend=r;synth.speak(u)});await sleep(300)}
    await sleep(500);
  }
  if(readCnCheck.checked&&item.mean){await new Promise(r=>{const u=new SpeechSynthesisUtterance(item.mean);u.lang="zh-CN";u.rate=rate;u.onend=r;synth.speak(u)});await sleep(500)}
  if(readSentenceCheck.checked){
    if(item.sentenceEn){await new Promise(r=>{const u=new SpeechSynthesisUtterance(item.sentenceEn);u.lang="en-US";u.rate=rate;u.onend=r;synth.speak(u)});await sleep(400)}
    if(item.sentenceCn){await new Promise(r=>{const u=new SpeechSynthesisUtterance(item.sentenceCn);u.lang="zh-CN";u.rate=rate;u.onend=r;synth.speak(u)})}
  }
}
async function showWord(item){
  wordDom.innerText=item.word||"";phoneticDom.innerText=item.phonetic||"";explainDom.innerText=item.mean||"";sentenceEnDom.innerText=item.sentenceEn||"";sentenceCnDom.innerText=item.sentenceCn||"";
  await speakWord(item);
  if(running){await sleep(Number(intervalInput.value)*1000);nextWord()}
}
function nextWord(){
  if(!running)return;
  if(randomCheck.checked)currentIndex=Math.floor(Math.random()*wordList.length);
  else currentIndex=(currentIndex+1)%wordList.length;
  showWord(wordList[currentIndex]);
}
document.getElementById('startBtn').onclick=function(){if(wordList.length===0){alert("请先加载词库");return}if(running)return;running=true;nextWord()};
document.getElementById('stopBtn').onclick=function(){running=false;window.speechSynthesis.cancel()};
</script>
</body>
</html>
