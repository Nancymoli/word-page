<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四级单词</title>
<style>
/* 登录弹窗样式 */
#loginBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.login-card{
  background:#fff;
  padding:30px;
  border-radius:12px;
}
#mainPage{
  display:none; /* 没登录前隐藏单词页面 */
}
</style>
</head>
<body>

<!-- 登录弹窗 -->
<div id="loginBox">
  <div class="login-card">
    <h3>请输入密码</h3>
    <input type="password" id="pwdInput" placeholder="输入密码">
    <button onclick="checkPwd()">确认</button>
    <p id="tip" style="color:red;display:none">密码错误</p>
  </div>
</div>

<!-- 单词主页面 -->
<div id="mainPage">
  <h1>四级单词本</h1>
  <div id="wordArea"></div>
</div>

<script>
// 在这里改密码
const PASSWORD = "XZ0413";

// 密码校验函数
function checkPwd(){
  const input = document.getElementById("pwdInput").value;
  if(input === PASSWORD){
    // 登录成功：隐藏弹窗，展示单词页面
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("mainPage").style.display = "block";
    loadWords(); //加载单词json
  }else{
    document.getElementById("tip").style.display = "block";
  }
}

// 加载cet4.json单词库
async function loadWords(){
  const res = await fetch("./cet4.json");
  const wordList = await res.json();
  const area = document.getElementById("wordArea");
  wordList.forEach(item=>{
    area.innerHTML += `<p>${item.word} — ${item.trans}</p>`
  })
}
</script>
</body>
</html>
