<!-- v=1.9 优化加载速度 + 语音卡顿修复，新增跳过朗读、读完再切换开关 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>小张刷英语</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
}
body{
  min-height: 100vh;
  background: linear-gradient(180deg, #fff6e8 0%, #ffe8f0 40%, #e8f3ff 100%);
  position: relative;
  overflow-x: hidden;
  padding-bottom: 30px;
}
.bubble{
  position:absolute;
  border-radius:50%;
  opacity:0.5;
  filter: blur(14px);
  z-index: 0;
  pointer-events:none;
}
.bubble1{ width:260px; height:260px; background:#ffb8dc; top:90px; left:-60px; }
.bubble2{ width:220px; height:220px; background:#b5dcff; top:110px; right:-40px; }

.top-title{ position:relative; z-index:2; text-align:center; padding:14px 12px 4px; }
.top-title h2{ font-size:22px; font-weight:600; color:#333; }
.progress-text{ margin-top:6px; font-size:16px; color:#555; }

.ctrl{
  position:relative; z-index:2;
  display:flex; flex-wrap:wrap; gap:10px;
  justify-content:center; margin:14px 12px 18px;
  align-items:center;
}
#dictSelect{ padding:10px 14px; border-radius:999px; border:none; font-size:16px; }
.jump-area{ display:flex; gap:8px; align-items:center; }
#jumpIndex{ width:80px; padding:10px; border-radius:999px; border:none; font-size:16px; text-align:center; }

button{
  border:none; padding:14px 22px; border-radius:999px;
  font-size:16px; font-weight:600; cursor:pointer; transition:0.2s;
}
button:active{ transform:scale(0.96); }
.btn-blue{ background:#a3d4ff; color:#222; }
.btn-pink{ background:#ffb3dd; color:#fff; }
.btn-green{ background:#9de0c4; color:#222; }
.btn-orange{ background:#ffd29d; color:#222; }
.btn-red{ background:#ff8888; color:#fff; }

.container{ position:relative; z-index:1; padding:0 14px; max-width:640px; margin:0 auto; }
.card{
  background:#ffffff; border-radius:28px; padding:32px 22px 28px;
  text-align:center; box-shadow:0 10px 30px rgba(255, 182, 220, 0.18);
  position:relative; z-index:2;
}
.word{ font-size:52px; font-weight:800; color:#222; margin-bottom:12px; }
.meaning-tag{
  display:inline-block; background:#a3d4ff; color:#222;
  font-size:20px; font-weight:600; padding:8px 18px;
  border-radius:999px; margin-bottom:24px;
}
.sentence-en{ font-size:18px; color:#333; line-height:1.6; margin-bottom:8px; }
.sentence-cn{ font-size:17px; color:#666; line-height:1.5; }

.setting-area{
  margin-top:20px; background:#ffffff; border-radius:24px; padding:20px;
  box-shadow:0 8px 24px rgba(163, 212, 255, 0.15);
}
.set-row{
  display:flex; align-items:center; justify-content:space-between;
  margin:16px 0; font-size:16px; color:#333;
}
.set-row input[type="number"]{
  width:72px; padding:8px; border-radius:10px;
  border:1px solid #ffc9e2; background:#fff;
  text-align:center; font-size:16px;
}
.switch-wrap{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
.switch-item{ display:flex; align-items:center; gap:8px; }
.switch{
  position:relative; width:48px; height:28px;
  background:#ffc5e3; border-radius:999px; cursor:pointer; transition:0.3s;
}
.switch::after{
  content:""; position:absolute; top:3px; left:3px;
  width:22px; height:22px; background:#fff;
  border-radius:50%; transition:0.3s;
}
.switch.active{ background:#ff88bc; }
.switch.active::after{ left:23px; }

.import-wrap{ margin-top:22px; text-align:center; }
.import-btn{
  display:inline-block; padding:14px 28px;
  background:#a3d4ff; border-radius:999px;
  font-weight:600; cursor:pointer;
}
#fileInput{ display:none; }
</style>
</head>
<body>
<div class="bubble bubble1"></div>
<div class="bubble bubble2"></div>

<div class="top-title">
  <h2>📖 小张刷英语</h2>
  <div class="progress-text" id="progressText">进度：0 / 0</div>
</div>

<div class="ctrl">
  <select id="dictSelect"></select>
  <button class="btn-blue" id="loadOnline">加载选中词库</button>
  <div class="jump-area">
    <input type="number" id="jumpIndex" placeholder="跳到第几个">
    <button class="btn-orange" id="jumpBtn">跳转</button>
  </div>
  <button class="btn-pink" id="startBtn">开始刷词</button>
  <button class="btn-green" id="stopBtn">暂停</button>
  <button class="btn-red" id="skipSpeakBtn">跳过朗读</button>
</div>

<div class="container">
  <div class="card">
    <div class="word" id="word">等待加载单词</div>
    <div class="meaning-tag" id="meaning">--</div>
    <div class="sentence-en" id="senEn">--</div>
    <div class="sentence-cn" id="senCn">--</div>
  </div>

  <div class="setting-area">
    <div class="set-row">
      <span>间隔（秒）：</span>
      <input type="number" id="interval" value="4" min="1">
    </div>
    <div class="set-row">
      <span>单词朗读次数：</span>
      <input type="number" id="enReadCount" value="2" min="1">
    </div>
    <div class="set-row">
      <span>朗读速率：</span>
      <input type="number" id="speechRate" value="1" min="0.5" max="2.5" step="0.1">
    </div>
    <div class="switch-wrap">
      <div class="switch-item">
        <div class="switch" id="randomSwitch"></div>
        <span>随机顺序</span>
      </div>
      <div class="switch-item">
        <div class="switch active" id="readEnSwitch"></div>
        <span>朗读英文</span>
      </div>
      <div class="switch-item">
        <div class="switch" id="readMeanSwitch"></div>
        <span>朗读释义</span>
      </div>
      <div class="switch-item">
        <div class="switch active" id="readSenSwitch"></div>
        <span>朗读例句</span>
      </div>
      <div class="switch-item">
        <div class="switch active" id="waitReadSwitch"></div>
        <span>读完再切换</span>
      </div>
    </div>
  </div>

  <div class="import-wrap">
    <label class="import-btn" for="fileInput">选择本地词库（可多选）</label>
    <input type="file" id="fileInput" accept=".json" multiple>
  </div>
</div>

<script>
let wordList = [];
let currentIndex = 0;
let running = false;

const domWord = document.getElementById('word');
const domMean = document.getElementById('meaning');
const domSenEn = document.getElementById('senEn');
const domSenCn = document.getElementById('senCn');
const intervalInput = document.getElementById('interval');
const enReadCountInput = document.getElementById('enReadCount');
const speechRateInput = document.getElementById('speechRate');
const dictSelect = document.getElementById('dictSelect');
const progressText = document.getElementById('progressText');
const jumpIndex = document.getElementById('jumpIndex');

const randomSwitch = document.getElementById('randomSwitch');
const readEnSwitch = document.getElementById('readEnSwitch');
const readMeanSwitch = document.getElementById('readMeanSwitch');
const readSenSwitch = document.getElementById('readSenSwitch');
const waitReadSwitch = document.getElementById('waitReadSwitch');

dictConfig.forEach((item, idx)=>{
  const opt = document.createElement('option');
  opt.value = idx;
  opt.innerText = item.name;
  dictSelect.appendChild(opt);
})

randomSwitch.onclick = ()=> randomSwitch.classList.toggle("active");
readEnSwitch.onclick = ()=> readEnSwitch.classList.toggle("active");
readMeanSwitch.onclick = ()=> readMeanSwitch.classList.toggle("active");
readSenSwitch.onclick = ()=> readSenSwitch.classList.toggle("active");
waitReadSwitch.onclick = ()=> waitReadSwitch.classList.toggle("active");

function updateProgress(){
  progressText.innerText = `进度：${currentIndex+1} / ${wordList.length}`;
  const selectIdx = Number(dictSelect.value);
  localStorage.setItem(`memIndex_${selectIdx}`, currentIndex);
}

// 并发分批加载，一次最多同时5个请求，提速
async function batchFetchFiles(files, concurrency = 5) {
  const results = [];
  let index = 0;
  const failedFiles = [];
  async function worker() {
    while(index < files.length) {
      const filename = files[index++];
      try{
        const res = await fetch(`./${filename}`);
        if(!res.ok) throw new Error("http error");
        const json = await res.json();
        if(Array.isArray(json)) results.push(...json);
      }catch(e){
        failedFiles.push(filename);
      }
    }
  }
  const workers = Array.from({length: concurrency}, ()=> worker());
  await Promise.all(workers);
  return {wordArr: results, failed: failedFiles};
}

document.getElementById('loadOnline').onclick = async ()=>{
  const selectIdx = Number(dictSelect.value);
  const dictItem = dictConfig[selectIdx];
  const fileList = dictItem.files;

  const {wordArr, failed} = await batchFetchFiles(fileList,5);
  if(wordArr.length === 0){
    alert("加载失败：没有任何词库文件读取成功。\n请检查文件名是否和配置一致。");
    return;
  }
  wordList = wordArr;

  const saved = localStorage.getItem(`memIndex_${selectIdx}`);
  if(saved !== null){
    currentIndex = Math.min(Number(saved), wordList.length -1);
  }else{
    currentIndex = 0;
  }

  updateProgress();
  showWord(wordList[currentIndex]);

  let msg = `词库【${dictItem.name}】加载完成\n单词总数：${wordList.length}\n上次背到第 ${currentIndex+1} 个`;
  if(failed.length > 0){
    msg += `\n\n加载失败文件：\n${failed.join("\n")}`;
  }
  alert(msg);
}

document.getElementById('jumpBtn').onclick = function(){
  const num = Number(jumpIndex.value);
  if(wordList.length === 0){alert("请先加载词库");return;}
  if(num < 1 || num > wordList.length){alert("超出范围");return;}
  currentIndex = num - 1;
  updateProgress();
  showWord(wordList[currentIndex]);
}

document.getElementById('fileInput').onchange = function(e){
  const files = Array.from(e.target.files);
  if(files.length === 0) return;
  let allWords = [];
  let done = 0;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const data = JSON.parse(evt.target.result);
        if(Array.isArray(data)) allWords = allWords.concat(data);
      }catch(err){
        console.warn(`${file.name} 解析失败：`, err);
      }
      done++;
      if(done === files.length){
        wordList = allWords;
        currentIndex = 0;
        updateProgress();
        showWord(wordList[currentIndex]);
        alert(`本地词库加载成功\n文件数：${files.length}\n单词总数：${wordList.length}`);
      }
    };
    reader.readAsText(file);
  });
}

function sleep(ms){
  return new Promise(res=>setTimeout(res,ms));
}

// 语音：直接取消旧语音，去掉轮询等待
async function speakText(text, lang="en-US"){
  if(!text) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = Number(speechRateInput.value) || 1;
  return new Promise(resolve => {
    utter.onend = ()=> resolve();
    speechSynthesis.speak(utter);
  });
}

async function speakWordAudio(item){
  const readTimes = Number(enReadCountInput.value) || 2;
  if(readEnSwitch.classList.contains("active")){
    for(let i=0; i<readTimes; i++){
      await speakText(item.word, "en-US");
    }
  }
  if(readMeanSwitch.classList.contains("active") && item.mean){
    await speakText(item.mean, "zh-CN");
  }
  if(readSenSwitch.classList.contains("active") && item.sentenceEn){
    await speakText(item.sentenceEn, "en-US");
    if(item.sentenceCn) await speakText(item.sentenceCn, "zh-CN");
  }
}

async function showWord(item){
  domWord.innerText = item.word;
  domMean.innerText = item.mean || "";
  domSenEn.innerText = item.sentenceEn || "";
  domSenCn.innerText = item.sentenceCn || "";

  const waitRead = waitReadSwitch.classList.contains("active");
  const speakPromise = speakWordAudio(item);

  if(running){
    const sec = Number(intervalInput.value)*1000;
    if(waitRead){
      await speakPromise;
      await sleep(sec);
    }else{
      await sleep(sec);
    }
    next();
  }
}

function next(){
  if(!running) return;
  if(randomSwitch.classList.contains("active")){
    currentIndex = Math.floor(Math.random() * wordList.length);
  }else{
    currentIndex = (currentIndex+1) % wordList.length;
  }
  updateProgress();
  showWord(wordList[currentIndex]);
}

document.getElementById('startBtn').onclick = function(){
  if(wordList.length === 0){alert("请先加载词库！");return;}
  running = true;
  next();
}
document.getElementById('stopBtn').onclick = function(){
  running = false;
  speechSynthesis.cancel();
}
document.getElementById('skipSpeakBtn').onclick = function(){
  speechSynthesis.cancel();
}

// ===== 词库配置 =====
const dictConfig = [
  {
    name: "小学词汇",
    files: [
      "primarylist1.json","primarylist2.json","primarylist3.json","primarylist4.json","primarylist5.json",
      "primarylist6.json","primarylist7.json","primarylist8.json","primarylist9.json","primarylist10.json",
      "primarylist11.json","primarylist12.json","primarylist13.json","primarylist14.json","primarylist15.json",
      "primarylist16.json","primarylist17.json","primarylist18.json","primarylist19.json","primarylist20.json"
    ]
  },
  {
    name: "初中词汇",
    files: [
      "juniorlist1.json","juniorlist2.json","juniorlist3.json","juniorlist4.json","juniorlist5.json",
      "juniorlist6.json","juniorlist7.json","juniorlist8.json","juniorlist9.json","juniorlist10.json",
      "juniorlist11.json","juniorlist12.json","juniorlist13.json","juniorlist14.json","juniorlist15.json",
      "juniorlist16.json","juniorlist17.json","juniorlist18.json","juniorlist19.json","juniorlist20.json"
    ]
  },
  {

      "seniorlist1.json","seniorlist2.json","seniorlist3.json","seniorlist4.json","seniorlist5.json",
      "seniorlist6.json","seniorlist7.json","seniorlist8.json","seniorlist9.json","seniorlist10.json",
      "seniorlist11.json","seniorlist12.json","seniorlist13.json","seniorlist14.json","seniorlist15.json",
      "seniorlist16.json","seniorlist17.json","seniorlist18.json","seniorlist19.json","seniorlist20.json"
    ]
  },
  {
    name: "四级词汇 4000词",
    files: [
      "cet4list1.json","cet4list2.json","cet4list3.json","cet4list4.json","cet4list5.json",
      "cet4list6.json","cet4list7.json","cet4list8.json","cet4list9.json","cet4list10.json",
      "cet4list11.json","cet4list12.json","cet4list13.json","cet4list14.json","cet4list15.json",
      "cet4list16.json","cet4list17.json","cet4list18.json","cet4list19.json","cet4list20.json"
    ]
  },
  {
    name: "六级词汇",
    files: [
      "cet6list1.json","cet6list2.json","cet6list3.json","cet6list4.json","cet6list5.json",
      "cet6list6.json","cet6list7.json","cet6list8.json","cet6list9.json","cet6list10.json",
      "cet6list11.json","cet6list12.json","cet6list13.json","cet6list14.json","cet6list15.json",
      "cet6list16.json","cet6list17.json","cet6list18.json","cet6list19.json","cet6list20.json"
    ]
  },
  {
    name: "考研词汇",
    files: [
      "kaoyanlist1.json","kaoyanlist2.json","kaoyanlist3.json","kaoyanlist4.json","kaoyanlist5.json",
      "kaoyanlist6.json","kaoyanlist7.json","kaoyanlist8.json","kaoyanlist9.json","kaoyanlist10.json",
      "kaoyanlist11.json","kaoyanlist12.json","kaoyanlist13.json","kaoyanlist14.json","kaoyanlist15.json",
      "kaoyanlist16.json","kaoyanlist17.json","kaoyanlist18.json","kaoyanlist19.json","kaoyanlist20.json"
    ]
  },
  {
    name: "雅思词汇",
    files: [
      "ieltslist1.json","ieltslist2.json","ieltslist3.json","ieltslist4.json","ieltslist5.json",
      "ieltslist6.json","ieltslist7.json","ieltslist8.json","ieltslist9.json","ieltslist10.json",
      "ieltslist11.json","ieltslist12.json","ieltslist13.json","ieltslist14.json","ieltslist15.json",
      "ieltslist16.json","ieltslist17.json","ieltslist18.json","ieltslist19.json","ieltslist20.json"

  }
];
</script>
</body>
