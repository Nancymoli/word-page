<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四级背单词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 32px;
            max-width: 600px;
            width: 100%;
        }
        .progress-bar {
            background: #e8ecf1;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .progress-text {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
            text-align: right;
        }
        .word {
            font-size: 42px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .phonetic {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }
        .mean {
            font-size: 22px;
            color: #2d3436;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }
        .sentence-label {
            font-size: 13px;
            color: #4facfe;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .sentence-en {
            font-size: 16px;
            color: #333;
            margin-bottom: 6px;
            line-height: 1.6;
        }
        .sentence-cn {
            font-size: 15px;
            color: #777;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-prev {
            background: #f0f2f5;
            color: #555;
        }
        .btn-prev:hover:not(:disabled) {
            background: #e4e7eb;
        }
        .btn-next {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
        }
        .btn-next:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79,172,254,0.4);
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .reset-btn {
            display: block;
            margin: 16px auto 0;
            background: none;
            color: #aaa;
            font-size: 13px;
            padding: 6px 12px;
            flex: none;
        }
        .reset-btn:hover {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 进度条 -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText"></div>

        <!-- 单词内容 -->
        <div class="word" id="word"></div>
        <div class="phonetic" id="phonetic"></div>
        <div class="mean" id="mean"></div>

        <div class="divider"></div>

        <!-- 例句 -->
        <div class="sentence-label">📖 例句</div>
        <div class="sentence-en" id="sentenceEn"></div>
        <div class="sentence-cn" id="sentenceCn"></div>

        <!-- 按钮 -->
        <div class="btn-group">
            <button class="btn-prev" id="prevBtn">← 上一个</button>
            <button class="btn-next" id="nextBtn">下一个 →</button>
        </div>
        <button class="reset-btn" id="resetBtn">重置进度，从头开始</button>
    </div>

    <script>
        // ========== 全局变量 ==========
        let wordList = [];      // 单词数组
        let currentIndex = 0;    // 当前单词下标

        // ========== 读取本地保存的进度 ==========
        function loadProgress() {
            const saved = localStorage.getItem("cet4_wordIndex");
            if (saved !== null) {
                currentIndex = parseInt(saved);
            }
        }

        // ========== 保存当前进度 ==========
        function saveProgress() {
            localStorage.setItem("cet4_wordIndex", currentIndex.toString());
        }

        // ========== 渲染当前单词到页面 ==========
        function renderWord() {
            const total = wordList.length;
            const item = wordList[currentIndex];

            // 更新进度文字和进度条
            document.getElementById("progressText").innerText = `进度：${currentIndex + 1} / ${total}`;
            const percent = ((currentIndex + 1) / total * 100).toFixed(1);
            document.getElementById("progressFill").style.width = percent + "%";

            // 更新单词内容
            document.getElementById("word").innerText = item.word;
            document.getElementById("phonetic").innerText = item.phonetic || "";
            document.getElementById("mean").innerText = item.mean || "";
            document.getElementById("sentenceEn").innerText = item.sentenceEn || "";
            document.getElementById("sentenceCn").innerText = item.sentenceCn || "";

            // 按钮禁用状态
            document.getElementById("prevBtn").disabled = (currentIndex === 0);
            document.getElementById("nextBtn").disabled = (currentIndex === total - 1);

            // 自动保存进度
            saveProgress();
        }

        // ========== 加载单词 JSON ==========
        async function loadWords() {
            try {
                const res = await fetch("cet4.json");
                if (!res.ok) throw new Error("文件加载失败");
                wordList = await res.json();

                // 读取上次进度
                loadProgress();

                // 防止保存的序号超出单词范围
                if (currentIndex >= wordList.length || isNaN(currentIndex)) {
                    currentIndex = 0;
                }

                // 渲染第一个单词
                renderWord();
            } catch (err) {
                document.getElementById("word").innerText = "加载失败";
                document.getElementById("mean").innerText = "请确认 cet4.json 和 index.html 在同一文件夹下";
                console.error(err);
            }
        }

        // ========== 绑定按钮事件 ==========
        document.getElementById("nextBtn").onclick = () => {
            if (currentIndex < wordList.length - 1) {
                currentIndex++;
                renderWord();
            }
        };

        document.getElementById("prevBtn").onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderWord();
            }
        };

        // 重置进度
        document.getElementById("resetBtn").onclick = () => {
            if (confirm("确定要重置进度吗？将从第一个单词开始。")) {
                currentIndex = 0;
                saveProgress();
                renderWord();
            }
        };

        // 键盘左右键切换
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
            if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
        });

        // ========== 启动 ==========
        loadWords();
    </script>
</body>
</html>
