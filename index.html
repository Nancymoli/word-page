<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小张刷英语 · CET4</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 24px 18px 40px;
    background:
      radial-gradient(circle at 10% 8%, #ffd6e0 0 10%, transparent 11%),
      radial-gradient(circle at 88% 12%, #d4f0ff 0 9%, transparent 10%),
      linear-gradient(180deg, #fff7e6 0%, #fff0f6 100%);
    color: #444;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景小装饰 */
  body::before,
  body::after {
    content: "✦";
    position: absolute;
    color: #ffb6c1;
    font-size: 28px;
    opacity: .55;
    z-index: 0;
  }
  body::before {
    top: 46px;
    left: 24px;
  }
  body::after {
    top: 90px;
    right: 30px;
    color: #b5e5d0;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* 顶部标题 */
  .top-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
    position: relative;
  }

  .top-bar h1 {
    font-size: 22px;
    font-weight: 800;
    color: #2b3445;
    background: #ffffffaa;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(255, 182, 193, .35);
  }

  /* 按钮通用 */
  button {
    border: none;
    border-radius: 999px;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 18px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(115, 169, 247, .35);
    transition: .2s;
  }

  button:active {
    transform: scale(.96);
  }

  .btn-primary {
    background: linear-gradient(135deg, #ffb6c1, #ff8fab);
  }

  .btn-secondary {
    background: linear-gradient(135deg, #b5e5d0, #7cd4b5);
  }

  .btn-blue {
    background: linear-gradient(135deg, #9ecbff, #73a9f7);
  }

  /* 控制区 */
  .control {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }

  /* 毛绒奶油大卡片 */
  .word-card {
    background:
      radial-gradient(circle at 30% 20%, #ffffff 0 18%, #fff7fb 19% 42%, #ffffff 43% 100%);
    border-radius: 36px;
    padding: 40px 28px;
    text-align: center;
    position: relative;
    box-shadow:
      0 20px 45px rgba(255, 182, 193, .35),
      0 10px 25px rgba(115, 169, 247, .25),
      inset 0 0 0 2px #ffffffcc;
    border: 3px solid #ffffff;
    margin-bottom: 18px;
  }

  /* 卡片上的小贴纸装饰 */
  .fox-sticker {
    position: absolute;
    left: 12px;
    bottom: -10px;
    width: 72px;
    height: 72px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: 0 6px 14px rgba(255, 182, 193, .45);
    border: 3px solid #fff;
    transform: rotate(-8deg);
  }

  .pencil-sticker {
    position: absolute;
    right: 14px;
    top: -14px;
    width: 54px;
    height: 54px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 6px 14px rgba(124, 212, 181, .45);
    border: 3px solid #fff;
    transform: rotate(12deg);
  }

  .word {
    font-size: 44px;
    font-weight: 900;
    color: #2b3445;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .phonetic {
    font-size: 18px;
    color: #7f8fa6;
    margin-bottom: 12px;
  }

  .explain {
    display: inline-block;
    background: linear-gradient(135deg, #cfe7ff, #a8dcff);
    color: #2b6ca3;
    font-size: 20px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    margin-bottom: 16px;
    box-shadow: 0 6px 14px rgba(115, 169, 247, .35);
  }

  .sentenceEn {
    font-size: 17px;
    color: #444;
    font-style: italic;
    margin-bottom: 10px;
  }

  .sentenceCn {
    font-size: 16px;
    color: #666;
  }

  /* 设置区 */
  .settings {
    background: #ffffffcc;
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 10px 24px rgba(255, 182, 193, .25);
    border: 2px solid #fff;
  }

  .setting-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    margin-bottom: 12px;
    color: #444;
    font-size: 15px;
  }

  .setting-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  input[type="number"] {
    padding: 8px 10px;
    border-radius: 999px;
    border: 2px solid #ffd6e0;
    background: #fff;
    width: 86px;
    text-align: center;
    outline: none;
  }

  /* 可爱开关 */
  .switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ffd6e0;
    transition: .3s;
    border-radius: 999px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, .1);
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
  }

  input:checked + .slider {
    background: linear-gradient(135deg, #ffb6c1, #ff8fab);
  }

  input:checked + .slider:before {
    transform: translateX(24px);
  }

  /* 文件输入隐藏美化 */
  .file-input-wrap {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }

  input[type="file"] {
    display: none;
  }

  .file-label {
    background: linear-gradient(135deg, #d4f0ff, #a8dcff);
    padding: 10px 16px;
    border-radius: 999px;
    color: #2b6ca3;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(115, 169, 247, .35);
  }

  textarea {
    display: none;
  }

  /* 登录框 */
  .login-box {
    position: fixed;
    inset: 0;
    background: rgba(255, 240, 246, .75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
    backdrop-filter: blur(6px);
  }

  .login-inner {
    background: #fff;
    padding: 28px;
    border-radius: 30px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 20px 40px rgba(255, 182, 193, .45);
    border: 3px solid #fff;
    text-align: center;
  }

  .login-inner h3 {
    margin-bottom: 16px;
    color: #2b3445;
  }

  #pwdInput {
    width: 100%;
    padding: 12px 14px;
    border-radius: 999px;
    border: 2px solid #ffd6e0;
    outline: none;
    margin-bottom: 12px;
  }

  #loginTip {
    color: #ff6b6b;
    font-size: 14px;
    margin-bottom: 10px;
    min-height: 20px;
  }

  .main-page {
    display: none;
  }
</style>
</head>

<body>
  <div class="login-box" id="loginBox">
    <div class="login-inner">
      <h3>🔐 请输入访问密码</h3>
      <input type="password" id="pwdInput" placeholder="输入密码" />
      <div id="loginTip"></div>
      <button id="loginBtn" class="btn-primary" style="width:100%">确认进入</button>
    </div>
  </div>

  <div class="container main-page" id="mainPage">
    <div class="top-bar">
      <h1>📖 小张刷英语 · CET4</h1>
    </div>

    <div class="control">
      <button id="loadOnline" class="btn-blue">加载四级词库（联网）</button>
      <button id="startBtn" class="btn-primary">开始刷词</button>
      <button id="stopBtn" class="btn-secondary">暂停</button>
    </div>

    <textarea id="wordListInput"></textarea>

    <div class="word-card" id="wordCard">
      <div class="fox-sticker">🦊</div>
      <div class="pencil-sticker">✏️</div>

      <div class="word" id="word"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="explain" id="explain"></div>
      <div class="sentenceEn" id="sentenceEn"></div>
      <div class="sentenceCn" id="sentenceCn"></div>
    </div>

    <div class="settings">
      <div class="setting-row">
        <label>间隔（秒）：<input type="number" id="interval" value="4" min="1" /></label>
        <label>单词朗读次数：<input type="number" id="repeatEnTimes" value="2" min="1" /></label>
        <label>朗读速率：<input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1" /></label>
      </div>

      <div class="setting-row">
        <label class="switch">
          <input type="checkbox" id="random" />
          <span class="slider"></span>
        </label>
        <span>随机顺序</span>

        <label class="switch">
          <input type="checkbox" id="readEn" checked />
          <span class="slider"></span>
        </label>
        <span>朗读英文</span>

        <label class="switch">
          <input type="checkbox" id="readCn" checked />
          <span class="slider"></span>
        </label>
        <span>朗读释义</span>

        <label class="switch">
          <input type="checkbox" id="readSentence" />
          <span class="slider"></span>
        </label>
        <span>朗读例句</span>
      </div>
    </div>

    <div class="file-input-wrap">
      <label class="file-label" for="fileInput">选择本地词库文件</label>
      <input type="file" id="fileInput" accept=".txt,.json" />
    </div>
  </div>

<script>
const loginBox = document.getElementById('loginBox');
const mainPage = document.getElementById('mainPage');
const pwdInput = document.getElementById('pwdInput');
const loginBtn = document.getElementById('loginBtn');
const loginTip = document.getElementById('loginTip');

loginBtn.onclick = checkPassword;
pwdInput.onkeydown = function(e){
  if(e.key === 'Enter') checkPassword();
};

async function checkPassword(){
  const inputPwd = pwdInput.value.trim();
  loginBtn.disabled = true;
  loginBtn.innerText = "验证中...";
  loginTip.innerText = "";
  try{
    const res = await fetch("/.netlify/functions/login",{
      method:"POST",
      body:JSON.stringify({pwd:inputPwd})
    });
    const data = await res.json();
    if(data.success){
      loginBox.style.display = 'none';
      mainPage.style.display = 'block';
    }else{
      loginTip.innerText = "密码错误，请重新输入";
      pwdInput.value = '';
    }
  }catch(err){
    loginTip.innerText = "网络验证失败";
    console.error(err);
  }
  loginBtn.disabled = false;
  loginBtn.innerText = "确认进入";
}

let wordList = [];
let currentIndex = 0;
let running = false;

const wordDom = document.getElementById('word');
const phoneticDom = document.getElementById('phonetic');
const explainDom = document.getElementById('explain');
const sentenceEnDom = document.getElementById('sentenceEn');
const sentenceCnDom = document.getElementById('sentenceCn');
const intervalInput = document.getElementById('interval');
const randomCheck = document.getElementById('random');
const readEnCheck = document.getElementById('readEn');
const readCnCheck = document.getElementById('readCn');
const readSentenceCheck = document.getElementById('readSentence');
const repeatEnInput = document.getElementById('repeatEnTimes');
const rateInput = document.getElementById('speechRate');

document.getElementById('loadOnline').onclick = async function(){
  try{
    const res = await fetch('cet4.json');
    const jsonData = await res.json();
    wordList = jsonData;
    currentIndex = 0;
    alert("词库加载完成！一共"+wordList.length+"个单词");
  }catch(e){
    console.error(e);
    alert("在线加载失败，请确认cet4.json已上传到仓库根目录");
  }
};

document.getElementById('fileInput').onchange = function(e){
  const reader = new FileReader();
  reader.onload = function(event){
    const text = event.target.result;
    try{
      const jsonData = JSON.parse(text);
      wordList = jsonData;
    }catch(err){
      parseWords(text);
    }
    alert("本地词库加载完成！一共"+wordList.length+"个单词");
  };
  reader.readAsText(e.target.files[0]);
};

function parseWords(text){
  const lines = text.split(/\r?\n/).filter(line=>line.trim()!=="");
  wordList = [];
  for(let line of lines){
    const reg = /^(.+?)\s+(\[.+?\])\s+(.+)$/;
    const match = line.match(reg);
    if(match){
      wordList.push({
        word:match[1],
        phonetic:match[2],
        mean:match[3],
        sentenceEn:"",
        sentenceCn:""
      });
    }
  }
  currentIndex = 0;
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function speakWord(item){
  const synth = window.speechSynthesis;
  synth.cancel();
  const rate = Number(rateInput.value);

  if(readEnCheck.checked && item.word){
    const times = Number(repeatEnInput.value);
    for(let i=0;i<times;i++){
      await new Promise(resolve=>{
        const utter = new SpeechSynthesisUtterance(item.word);
        utter.lang = "en-US";
        utter.rate = rate;
        utter.onend = resolve;
        synth.speak(utter);
      });
      await sleep(300);
    }
    await sleep(500);
  }

  if(readCnCheck.checked && item.mean){
    await new Promise(resolve=>{
      const utterCn = new SpeechSynthesisUtterance(item.mean);
      utterCn.lang = "zh-CN";
      utterCn.rate = rate;
      utterCn.onend = resolve;
      synth.speak(utterCn);
    });
    await sleep(500);
  }

  if(readSentenceCheck.checked){
    if(item.sentenceEn){
      await new Promise(resolve=>{
        const utterSenEn = new SpeechSynthesisUtterance(item.sentenceEn);
        utterSenEn.lang = "en-US";
        utterSenEn.rate = rate;
        utterSenEn.onend = resolve;
        synth.speak(utterSenEn);
      });
      await sleep(400);
    }
    if(item.sentenceCn){
      await new Promise(resolve=>{
        const utterSenCn = new SpeechSynthesisUtterance(item.sentenceCn);
        utterSenCn.lang = "zh-CN";
        utterSenCn.rate = rate;
        utterSenCn.onend = resolve;
        synth.speak(utterSenCn);
      });
    }
  }
}

async function showWord(item){
  wordDom.innerText = item.word || "";
  phoneticDom.innerText = item.phonetic || "";
  explainDom.innerText = item.mean || "";
  sentenceEnDom.innerText = item.sentenceEn || "";
  sentenceCnDom.innerText = item.sentenceCn || "";
  await speakWord(item);
  if(running){
    await sleep(Number(intervalInput.value)*1000);
    nextWord();
  }
}

function nextWord(){
  if(!running) return;
  if(randomCheck.checked){
    currentIndex = Math.floor(Math.random() * wordList.length);
  }else{
    currentIndex = (currentIndex + 1) % wordList.length;
  }
  showWord(wordList[currentIndex]);
}

document.getElementById('startBtn').onclick = function(){
  if(wordList.length === 0){
    alert("请先加载词库");
    return;
  }
  if(running) return;
  running = true;
  nextWord();
};

document.getElementById('stopBtn').onclick = function(){
  running = false;
  window.speechSynthesis.cancel();
};
</script>
</body>
</html>
