<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词卡片背诵</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, sans-serif;
}
body{
  min-height:100vh;
  background-color: #fff6e8;
  position: relative;
  overflow-x:hidden;
}
/* 粉蓝模糊泡泡背景，和截图样式一致 */
.bubble{
  position:absolute;
  border-radius:50%;
  opacity:0.45;
  filter: blur(12px);
  z-index: 0;
}
.bubble1{
  width:320px;
  height:320px;
  background:#ffb8cc;
  top:60px;
  left:-80px;
}
.bubble2{
  width:280px;
  height:280px;
  background:#a8ddff;
  top:80px;
  right:-60px;
}
.container{
  position:relative;
  z-index:1;
  padding:40px 20px;
  max-width:700px;
  margin:0 auto;
}
h1{
  text-align:center;
  font-size:24px;
  color:#333;
  margin-bottom:24px;
}
.ctrl{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:24px;
}
button{
  border:none;
  padding:12px 20px;
  border-radius:999px;
  background:#ffb8cc;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}
button:active{
  transform:scale(0.96);
}
.btn-blue{
  background:#a8ddff;
  color:#222;
}
.card{
  background:#ffffffdd;
  border-radius:32px;
  padding:40px 24px;
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,0.06);
}
.word{
  font-size:42px;
  font-weight:bold;
  color:#222;
  margin-bottom:12px;
}
.phonetic{
  font-size:18px;
  color:#666;
  margin-bottom:16px;
}
.meaning{
  font-size:22px;
  color:#444;
  margin-bottom:16px;
}
.sentence-en{
  font-size:17px;
  color:#444;
  font-style:italic;
  margin-bottom:8px;
}
.sentence-cn{
  font-size:16px;
  color:#666;
}
.setting-area{
  margin-top:24px;
  background:#ffffffaa;
  border-radius:24px;
  padding:16px;
}
.file-input-wrap{
  margin-top:16px;
  text-align:center;
}
#fileInput{
  display:none;
}
.file-label{
  display:inline-block;
  padding:10px 18px;
  background:#a8ddff;
  border-radius:999px;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="bubble bubble1"></div>
<div class="bubble bubble2"></div>

<div class="container">
  <h1>单词背诵卡片</h1>
  <div class="ctrl">
    <button class="btn-blue" id="loadOnline">加载词库(联网)</button>
    <button id="startBtn">开始自动刷词</button>
    <button id="stopBtn">暂停</button>
  </div>

  <div class="card">
    <div class="word" id="word">等待加载单词</div>
    <div class="phonetic" id="phonetic"></div>
    <div class="meaning" id="meaning"></div>
    <div class="sentence-en" id="senEn"></div>
    <div class="sentence-cn" id="senCn"></div>
  </div>

  <div class="setting-area">
    <div>
      <label>刷新间隔(秒)：<input type="number" id="interval" value="4" min="1"></label>
      <label><input type="checkbox" id="random">随机顺序</label>
      <label><input type="checkbox" id="readWord" checked>朗读单词</label>
    </div>
  </div>

  <div class="file-input-wrap">
    <label class="file-label" for="fileInput">导入本地词库json</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
</div>

<script>
let wordList = [];
let currentIndex = 0;
let running = false;

const domWord = document.getElementById('word');
const domPhonetic = document.getElementById('phonetic');
const domMean = document.getElementById('meaning');
const domSenEn = document.getElementById('senEn');
const domSenCn = document.getElementById('senCn');
const intervalInput = document.getElementById('interval');
const randomCheck = document.getElementById('random');
const readCheck = document.getElementById('readWord');

// 联网加载词库，读取仓库里 wordlist.json
document.getElementById('loadOnline').onclick = async ()=>{
  try{
    const res = await fetch("./wordlist.json");
    wordList = await res.json();
    currentIndex = 0;
    alert(`词库加载完成，一共${wordList.length}个单词`);
  }catch(e){
    alert("加载失败，请确认仓库存在 wordlist.json");
  }
}

// 本地文件导入
document.getElementById('fileInput').onchange = function(e){
  const reader = new FileReader();
  reader.onload = evt=>{
    const data = JSON.parse(evt.target.result);
    wordList = data;
    currentIndex = 0;
    alert(`本地词库加载成功，共${wordList.length}个单词`);
  }
  reader.readAsText(e.target.files[0]);
}

function sleep(ms){
  return new Promise(res=>setTimeout(res,ms));
}

async function speak(text){
  if(!readCheck.checked || !text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  await new Promise(r=>{utter.onend=r; window.speechSynthesis.speak(utter)});
}

async function showWord(item){
  domWord.innerText = item.word;
  domPhonetic.innerText = item.phonetic || "";
  domMean.innerText = item.mean || "";
  domSenEn.innerText = item.sentenceEn || "";
  domSenCn.innerText = item.sentenceCn || "";
  await speak(item.word);
  if(running){
    await sleep(Number(intervalInput.value)*1000);
    next();
  }
}

function next(){
  if(!running) return;
  if(randomCheck.checked){
    currentIndex = Math.floor(Math.random() * wordList.length);
  }else{
    currentIndex = (currentIndex+1) % wordList.length;
  }
  showWord(wordList[currentIndex]);
}

document.getElementById('startBtn').onclick = function(){
  if(wordList.length ===0){alert("请先加载词库！");return;}
  running=true;
  next();
}
document.getElementById('stopBtn').onclick = function(){
  running = false;
  speechSynthesis.cancel();
}
</script>
</body>
</html>
