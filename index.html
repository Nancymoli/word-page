<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词本</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#111;color:#fff;padding:20px}
        .login-box{max-width:400px;margin:100px auto;background:#222;padding:30px;border-radius:12px}
        .hidden{display:none}
        #wordPage{max-width:900px;margin:0 auto}
        input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;font-size:16px}
        button{padding:12px 20px;border:none;border-radius:8px;background:#4285f4;color:white;font-size:16px;cursor:pointer}
        .tip{color:#ff6b6b;margin-top:10px}
    </style>
</head>
<body>
    <!-- 登录面板 -->
    <div class="login-box" id="loginBox">
        <h2>请输入访问密码</h2>
        <input type="password" id="pwdInput" placeholder="输入密码">
        <button onclick="checkPassword()">确认登录</button>
        <div class="tip" id="errTip"></div>
    </div>

    <!-- 单词本页面（登录成功后显示） -->
    <div id="wordPage" class="hidden">
        <h1>我的单词本</h1>
        <p>这里放你的单词内容</p>
    </div>

<script>
async function checkPassword(){
    const inputPwd = document.getElementById("pwdInput").value.trim();
    const errTip = document.getElementById("errTip");
    if(!inputPwd){
        errTip.innerText="请输入密码";
        return;
    }
    try{
        const res = await fetch("https://word-page.1980157332.workers.dev",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({pwd: inputPwd})
        })
        const data = await res.json();
        if(data.success){
            // 登录成功，切换页面
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("wordPage").classList.remove("hidden");
        }else{
            errTip.innerText="密码错误";
        }
    }catch(err){
        errTip.innerText="接口请求失败，请稍后重试";
        console.error(err);
    }
}
</script>
</body>
</html>
