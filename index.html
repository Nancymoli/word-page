<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小张刷英语 · CET4</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto}
        body{padding:20px;background:#f7faff;color:#333}
        .container{max-width:700px;margin:0 auto}
        button{padding:12px 16px;border:none;border-radius:16px;background:#73a9f7;color:#fff;font-size:16px;margin:6px;cursor:pointer;box-shadow:0 3px 6px #00000012;transition:0.2s}
        button:active{transform:scale(0.97)}
        textarea{display:none;}
        .word-card{padding:36px;background:#ffffff;border-radius:24px;text-align:center;margin:16px 0;box-shadow:0 4px 12px #b9d4f850}
        .word{font-size:36px;margin-bottom:10px;font-weight:600}
        .phonetic{font-size:20px;margin-bottom:10px;color:#666}
        .explain{font-size:22px;margin-bottom:14px;color:#222}
        .sentenceEn{font-size:18px;color:#444;margin-bottom:8px;font-style:italic;}
        .sentenceCn{font-size:17px;color:#666;}
        .control{margin:14px 0}
        .setting-row{margin:10px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
        input[type="number"]{padding:8px;border:1px solid #ccdfff;border-radius:10px;width:80px;font-size:16px}
        input[type="file"]{margin:8px 0}
        label{display:flex;align-items:center;gap:4px}
        .login-box{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:999}
        .login-inner{background:#fff;padding:28px;border-radius:24px;width:100%;max-width:340px;box-shadow:0 4px 16px #00000015}
        .login-inner h3{margin-bottom:18px;text-align:center}
        #pwdInput{width:100%;padding:12px;border:1px solid #ccdfff;border-radius:14px;margin-bottom:14px;font-size:16px}
        #loginTip{color:#e74c3c;height:22px;margin-bottom:10px;font-size:14px}
        .main-page{display:none;}
    </style>
</head>
<body>
<div class="login-box" id="loginBox">
    <div class="login-inner">
        <h3>🔐 请输入访问密码</h3>
        <input type="password" id="pwdInput" placeholder="输入密码">
        <div id="loginTip"></div>
        <button id="loginBtn" style="width:100%">确认进入</button>
    </div>
</div>

<div class="container main-page" id="mainPage">
    <h2 style="text-align:center;margin-bottom:16px;color:#345;">📖 小张刷英语 · CET4</h2>
    <div class="control">
        <button id="loadOnline">加载四级词库（联网）</button>
        <input type="file" id="fileInput" accept=".txt,.json">
        <button id="startBtn">开始刷词</button>
        <button id="stopBtn">暂停</button>
    </div>
    <textarea id="wordListInput"></textarea>
    <div class="word-card" id="wordCard">
        <div class="word" id="word"></div>
        <div class="phonetic" id="phonetic"></div>
        <div class="explain" id="explain"></div>
        <div class="sentenceEn" id="sentenceEn"></div>
        <div class="sentenceCn" id="sentenceCn"></div>
    </div>
    <div class="control">
        <div class="setting-row">
            <label>间隔（秒）：<input type="number" id="interval" value="4" min="1"></label>
            <label>单词朗读次数：<input type="number" id="repeatEnTimes" value="2" min="1"></label>
            <label>朗读速率：<input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1"></label>
        </div>
        <div class="setting-row">
            <label><input type="checkbox" id="random">随机顺序</label>
            <label><input type="checkbox" id="readEn" checked>朗读英文</label>
            <label><input type="checkbox" id="readCn" checked>朗读释义</label>
            <label><input type="checkbox" id="readSentence">朗读例句</label>
        </div>
    </div>
</div>

<script>
const loginBox = document.getElementById('loginBox');
const mainPage = document.getElementById('mainPage');
const pwdInput = document.getElementById('pwdInput');
const loginBtn = document.getElementById('loginBtn');
const loginTip = document.getElementById('loginTip');

loginBtn.onclick = checkPassword;
pwdInput.onkeydown = function(e){
    if(e.key === 'Enter') checkPassword();
}

async function checkPassword(){
    const inputPwd = pwdInput.value.trim();
    loginBtn.disabled = true;
    loginBtn.innerText = "验证中...";
    loginTip.innerText = "";
    try{
        const res = await fetch("/.netlify/functions/login",{
            method:"POST",
            body:JSON.stringify({pwd:inputPwd})
        });
        const data = await res.json();
        if(data.success){
            loginBox.style.display = 'none';
            mainPage.style.display = 'block';
        }else{
            loginTip.innerText = "密码错误，请重新输入";
            pwdInput.value = '';
        }
    }catch(err){
        loginTip.innerText = "网络验证失败";
        console.error(err);
    }
    loginBtn.disabled = false;
    loginBtn.innerText = "确认进入";
}

let wordList = [];
let currentIndex = 0;
let running = false;
const wordDom = document.getElementById('word');
const phoneticDom = document.getElementById('phonetic');
const explainDom = document.getElementById('explain');
const sentenceEnDom = document.getElementById('sentenceEn');
const sentenceCnDom = document.getElementById('sentenceCn');
const wordListInput = document.getElementById('wordListInput');
const intervalInput = document.getElementById('interval');
const randomCheck = document.getElementById('random');
const readEnCheck = document.getElementById('readEn');
const readCnCheck = document.getElementById('readCn');
const readSentenceCheck = document.getElementById('readSentence');
const repeatEnInput = document.getElementById('repeatEnTimes');
const rateInput = document.getElementById('speechRate');

document.getElementById('loadOnline').onclick = async function(){
    try{
        const res = await fetch('cet4.json');
        const jsonData = await res.json();
        wordList = jsonData;
        currentIndex = 0;
        alert("词库加载完成！一共"+wordList.length+"个单词");
    }catch(e){
        console.error(e);
        alert("在线加载失败，请确认cet4.json已上传到仓库根目录");
    }
}

document.getElementById('fileInput').onchange = function(e){
    const reader = new FileReader();
    reader.onload = function(event){
        const text = event.target.result;
        try{
            const jsonData = JSON.parse(text);
            wordList = jsonData;
        }catch(err){
            parseWords(text);
        }
        alert("本地词库加载完成！一共"+wordList.length+"个单词");
    }
    reader.readAsText(e.target.files[0]);
}

function parseWords(text){
    const lines = text.split(/\r?\n/).filter(line=>line.trim()!=='');
    wordList = [];
    for(let line of lines){
        const reg = /^(.+?)\s+(\[.+?\])\s+(.+)$/;
        const match = line.match(reg);
        if(match){
            wordList.push({
                word:match[1],
                phonetic:match[2],
                mean:match[3],
                sentenceEn:"",
                sentenceCn:""
            })
        }
    }
    currentIndex = 0;
}

// 语音朗读，增加停顿优化
async function speakWord(item){
    const synth = window.speechSynthesis;
    synth.cancel();
    const rate = Number(rateInput.value);
    //英文单词循环读N次，单词之间加停顿
    if(readEnCheck.checked && item.word){
        const times = Number(repeatEnInput.value);
        for(let i=0;i<times;i++){
            await new Promise(resolve=>{
                const utter = new SpeechSynthesisUtterance(item.word);
                utter.lang = "en-US";
                utter.rate = rate;
                utter.onend = resolve;
                synth.speak(utter);
            })
            await sleep(300); //单词重复之间停顿0.3秒
        }
        await sleep(500); //读完单词，等0.5秒再读释义
    }
    //读完英文，再读中文释义
    if(readCnCheck.checked && item.mean){
        await new Promise(resolve=>{
            const utterCn = new SpeechSynthesisUtterance(item.mean);
            utterCn.lang = "zh-CN";
            utterCn.rate = rate;
            utterCn.onend = resolve;
            synth.speak(utterCn);
        })
        await sleep(500); //释义读完停顿0.5秒，再读例句
    }
    //如果勾选朗读例句，就读英文句子+中文句子，中间加停顿
    if(readSentenceCheck.checked){
        if(item.sentenceEn){
            await new Promise(resolve=>{
                const utterSenEn = new SpeechSynthesisUtterance(item.sentenceEn);
                utterSenEn.lang = "en-US";
                utterSenEn.rate = rate;
                utterSenEn.onend = resolve;
                synth.speak(utterSenEn);
            })
            await sleep(400); //英文例句读完停顿0.4秒再读中文例句
        }
        if(item.sentenceCn){
            await new Promise(resolve=>{
                const utterSenCn = new SpeechSynthesisUtterance(item.sentenceCn);
                utterSenCn.lang = "zh-CN";
                utterSenCn.rate = rate;
                utterSenCn.onend = resolve;
                synth.speak(utterSenCn);
            })
        }
    }
}

async function showWord(item){
    wordDom.innerText = item.word || "";
    phoneticDom.innerText = item.phonetic || "";
    explainDom.innerText = item.mean || "";
    sentenceEnDom.innerText = item.sentenceEn || "";
    sentenceCnDom.innerText = item.sentenceCn || "";
    await speakWord(item);
    if(running){
        await sleep(Number(intervalInput.value)*1000);
        nextWord();
    }
}
function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}
function nextWord(){
    if(!running) return;
    if(randomCheck.checked){
        currentIndex = Math.floor(Math.random() * wordList.length);
    }else{
        currentIndex = (currentIndex + 1) % wordList.length;
    }
    showWord(wordList[currentIndex]);
}

document.getElementById('startBtn').onclick = function(){
    if(wordList.length === 0){
        alert("请先加载词库");
        return;
    }
    if(running) return;
    running = true;
    nextWord();
}

document.getElementById('stopBtn').onclick = function(){
    running = false;
    window.speechSynthesis.cancel();
}
</script>
</body>
