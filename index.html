<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词背诵卡片</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, sans-serif;
}
body{
  min-height:100vh;
  background-color: #fff6e8;
  position: relative;
  overflow-x:hidden;
}
/* 粉蓝模糊泡泡背景 */
.bubble{
  position:absolute;
  border-radius:50%;
  opacity:0.45;
  filter: blur(12px);
  z-index: 0;
}
.bubble1{
  width:320px;
  height:320px;
  background:#ffb8cc;
  top:60px;
  left:-80px;
}
.bubble2{
  width:280px;
  height:280px;
  background:#a8ddff;
  top:80px;
  right:-60px;
}
.container{
  position:relative;
  z-index:1;
  padding:40px 20px;
  max-width:700px;
  margin:0 auto;
}
h1{
  text-align:center;
  font-size:28px;
  color:#333;
  margin-bottom:24px;
}
.ctrl{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:24px;
}
button{
  border:none;
  padding:14px 24px;
  border-radius:999px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}
button:active{
  transform:scale(0.96);
}
.btn-blue{
  background:#a8ddff;
  color:#222;
}
.btn-pink{
  background:#ffb8cc;
  color:white;
}
.card{
  background:#ffffffdd;
  border-radius:32px;
  padding:40px 24px;
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,0.06);
}
.word{
  font-size:56px;
  font-weight:bold;
  color:#222;
  margin-bottom:12px;
}
.phonetic{
  font-size:20px;
  color:#666;
  margin-bottom:20px;
}
.meaning{
  font-size:26px;
  color:#444;
  margin-bottom:24px;
}
.sentence-en{
  font-size:20px;
  color:#444;
  font-style:italic;
  margin-bottom:10px;
}
.sentence-cn{
  font-size:18px;
  color:#666;
}
.setting-area{
  margin-top:24px;
  background:#ffffffaa;
  border-radius:24px;
  padding:20px;
  line-height:2.2;
}
.file-input-wrap{
  margin-top:24px;
  text-align:center;
}
#fileInput{
  display:none;
}
.file-label{
  display:inline-block;
  padding:14px 24px;
  background:#a8ddff;
  border-radius:999px;
  cursor:pointer;
  font-weight:bold;
}
input[type="number"]{
  padding:6px;
  width:70px;
  border-radius:8px;
  border:1px solid #ccc;
}
</style>
</head>
<body>
<div class="bubble bubble1"></div>
<div class="bubble bubble2"></div>

<div class="container">
  <h1>单词背诵卡片</h1>
  <div class="ctrl">
    <button class="btn-blue" id="loadOnline">加载词库(联网)</button>
    <button class="btn-pink" id="startBtn">开始自动刷词</button>
    <button class="btn-pink" id="stopBtn">暂停</button>
  </div>

  <div class="card">
    <div class="word" id="word">等待加载单词</div>
    <div class="phonetic" id="phonetic"></div>
    <div class="meaning" id="meaning"></div>
    <div class="sentence-en" id="senEn"></div>
    <div class="sentence-cn" id="senCn"></div>
  </div>

  <div class="setting-area">
    <div>
      <label>刷新间隔(秒)：<input type="number" id="interval" value="4" min="1"></label>
    </div>
    <div>
      <label>英文朗读次数：<input type="number" id="enReadCount" value="2" min="1"></label>
    </div>
    <div>
      <label>朗读速率(0.5~2)：<input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1"></label>
    </div>
    <div>
      <label><input type="checkbox" id="random">随机顺序</label>
      <label><input type="checkbox" id="readMean" checked>朗读中文释义</label>
    </div>
    <div>
      <label><input type="checkbox" id="readSenEn">朗读英文例句</label>
      <label><input type="checkbox" id="readSenCn">朗读例句中文</label>
    </div>
  </div>

  <div class="file-input-wrap">
    <label class="file-label" for="fileInput">导入本地词库json</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
</div>

<script>
let wordList = [];
let currentIndex = 0;
let running = false;
let isSpeaking = false;

const domWord = document.getElementById('word');
const domPhonetic = document.getElementById('phonetic');
const domMean = document.getElementById('meaning');
const domSenEn = document.getElementById('senEn');
const domSenCn = document.getElementById('senCn');
const intervalInput = document.getElementById('interval');
const randomCheck = document.getElementById('random');
const enReadCountInput = document.getElementById('enReadCount');
const speechRateInput = document.getElementById('speechRate');
const readMeanCheck = document.getElementById('readMean');
const readSenEnCheck = document.getElementById('readSenEn');
const readSenCnCheck = document.getElementById('readSenCn');

// 联网加载词库
document.getElementById('loadOnline').onclick = async ()=>{
  try{
    const res = await fetch("./wordlist.json");
    wordList = await res.json();
    currentIndex = 0;
    alert(`词库加载完成，一共${wordList.length}个单词`);
  }catch(e){
    alert("加载失败，请确认仓库存在 wordlist.json");
  }
}

// 本地文件导入
document.getElementById('fileInput').onchange = function(e){
  const reader = new FileReader();
  reader.onload = evt=>{
    const data = JSON.parse(evt.target.result);
    wordList = data;
    currentIndex = 0;
    alert(`本地词库加载成功，共${wordList.length}个单词`);
  }
  reader.readAsText(e.target.files[0]);
}

function sleep(ms){
  return new Promise(res=>setTimeout(res,ms));
}

// 朗读函数：一段读完才继续下一段，不会打断正在播放的语音
async function speakText(text, lang="en-US"){
  if(!text) return;
  // 等待上一句读完
  while(isSpeaking) await sleep(100);
  isSpeaking = true;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = Number(speechRateInput.value) || 1;
  await new Promise(resolve => {
    utter.onend = ()=>{
      isSpeaking = false;
      resolve();
    };
    speechSynthesis.speak(utter);
  });
}

async function speakWordAudio(item){
  // 重复读英文单词N遍
  const readTimes = Number(enReadCountInput.value) || 2;
  for(let i=0; i<readTimes; i++){
    await speakText(item.word, "en-US");
  }
  // 读中文释义
  if(readMeanCheck.checked && item.mean){
    await speakText(item.mean, "zh-CN");
  }
  // 读英文例句
  if(readSenEnCheck.checked && item.sentenceEn){
    await speakText(item.sentenceEn, "en-US");
  }
  // 读例句中文
  if(readSenCnCheck.checked && item.sentenceCn){
    await speakText(item.sentenceCn, "zh-CN");
  }
}

async function showWord(item){
  domWord.innerText = item.word;
  domPhonetic.innerText = item.phonetic || "";
  domMean.innerText = item.mean || "";
  domSenEn.innerText = item.sentenceEn || "";
  domSenCn.innerText = item.sentenceCn || "";
  await speakWordAudio(item);
  if(running){
    await sleep(Number(intervalInput.value)*1000);
    next();
  }
}

function next(){
  if(!running) return;
  if(randomCheck.checked){
    currentIndex = Math.floor(Math.random() * wordList.length);
  }else{
    currentIndex = (currentIndex+1) % wordList.length;
  }
  showWord(wordList[currentIndex]);
}

document.getElementById('startBtn').onclick = function(){
  if(wordList.length ===0){alert("请先加载词库！");return;}
  running=true;
  next();
}
document.getElementById('stopBtn').onclick = function(){
  running = false;
  speechSynthesis.cancel();
  isSpeaking = false;
}
</script>
</body>
</html>
