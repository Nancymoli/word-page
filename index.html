<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>小张刷英语 · App版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="deco deco-1">🌿</div>
<div class="deco deco-2">🌙</div>

<header class="app-header">
  <div class="stat streak">🔥 <span class="num" id="statStreak">0</span> 天</div>
  <div class="stat goal">🎯 <span class="num" id="statToday">0</span>/<span id="statGoal">20</span></div>
  <div class="stat time">⏱️ <span class="num" id="statTime">0</span> 分</div>
</header>

<main class="app-main">

  <section class="tab-page active" data-tab="study">

    <!-- ★ 主界面快捷加载 -->
    <div class="quick-load">
      <select id="dictSelectQuick"></select>
      <button class="btn-blue" id="loadOnlineQuick">加载词库</button>
    </div>
    <div class="load-progress" id="quickProgress" style="display:none;">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="quickProgressFill"></div>
      </div>
      <div class="progress-percent">
        <span class="num" id="quickProgressNum">0</span>%
      </div>
    </div>

    <div class="card" id="card">
      <div class="card-swipe-hint left">不熟</div>
      <div class="card-swipe-hint right">掌握</div>
      <div class="card-content" id="cardContent">
        <div class="word waiting" id="word">点上方按钮加载词库</div>
        <div class="meaning-tag" id="meaning">--</div>
        <div class="sentence-en" id="senEn">--</div>
        <div class="sentence-cn" id="senCn">--</div>
      </div>
    </div>

    <div class="mastery-row">
      <button class="mastery-btn weak" id="markWeak">❌ 不熟</button>
      <button class="mastery-btn mastered" id="markMastered">✅ 掌握</button>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" aria-label="上一个">◀</button>
      <button class="nav-btn listen" id="listenBtn" aria-label="重听">🔊</button>
      <button class="nav-btn" id="nextBtn" aria-label="下一个">▶</button>
    </div>

    <div class="progress-bar">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-percent">
        <span class="num" id="progressNum">0</span> / <span id="progressTotal">0</span>
      </div>
    </div>
  </section>

  <section class="tab-page" data-tab="data">
    <div class="data-card">
      <h3>📊 学习进度</h3>
      <div class="progress-ring-wrap">
        <div class="progress-ring">
          <svg viewBox="0 0 140 140">
            <defs>
              <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffc8dc" />
                <stop offset="50%" stop-color="#ffa8c8" />
                <stop offset="100%" stop-color="#ff88b8" />
              </linearGradient>
            </defs>
            <circle class="track" cx="70" cy="70" r="58"></circle>
            <circle class="fill" id="ringFill" cx="70" cy="70" r="58" stroke-dasharray="364.4" stroke-dashoffset="364.4"></circle>
          </svg>
          <div class="ring-text">
            <div class="pct" id="ringPct">0%</div>
            <div class="sub" id="ringSub">0 / 0</div>
          </div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="label">未测</div><div class="value" id="statUnseen">0</div></div>
        <div class="stat-box"><div class="label">掌握</div><div class="value" id="statMastered">0</div></div>
        <div class="stat-box"><div class="label">不熟</div><div class="value" id="statWeak">0</div></div>
        <div class="stat-box"><div class="label">收藏</div><div class="value" id="statStar">0</div></div>
      </div>
    </div>

    <div class="data-card">
      <h3>📈 本周学习</h3>
      <div class="week-chart" id="weekChart">
        <div class="week-bar" data-day="一"><span class="day">一</span></div>
        <div class="week-bar" data-day="二"><span class="day">二</span></div>
        <div class="week-bar" data-day="三"><span class="day">三</span></div>
        <div class="week-bar" data-day="四"><span class="day">四</span></div>
        <div class="week-bar" data-day="五"><span class="day">五</span></div>
        <div class="week-bar" data-day="六"><span class="day">六</span></div>
        <div class="week-bar" data-day="日"><span class="day">日</span></div>
      </div>
    </div>

    <button class="big-btn btn-green" id="testBtn">🎲 随机抽测 10 题</button>
    <button class="big-btn btn-soft" id="reviewWeakBtn">🔴 只复习「不熟」的</button>
    <button class="big-btn btn-soft" id="reviewAllBtn">📚 复习全部</button>
  </section>

  <section class="tab-page" data-tab="star">
    <div class="star-list" id="starList">
      <div class="star-empty">
        <span class="emoji">⭐</span>
        还没有收藏的单词<br>
        点击卡片上的 ☆ 加入生词本
      </div>
    </div>
    <button class="big-btn btn-purple" id="reviewStarBtn" style="margin-top:16px;">⭐ 只复习生词</button>
  </section>

  <section class="tab-page" data-tab="settings">

    <div class="setting-group">
      <h4>🎨 主题皮肤</h4>
      <div class="theme-grid">
        <div class="theme-swatch active" data-theme="cream"><span class="emoji">🌸</span>奶油</div>
        <div class="theme-swatch" data-theme="glass"><span class="emoji">🧊</span>玻璃</div>
        <div class="theme-swatch" data-theme="neon"><span class="emoji">🌌</span>霓虹</div>
        <div class="theme-swatch" data-theme="minimal"><span class="emoji">🖤</span>极简</div>
        <div class="theme-swatch" data-theme="forest"><span class="emoji">🌿</span>森林</div>
        <div class="theme-swatch" data-theme="night"><span class="emoji">🌙</span>夜间</div>
      </div>
    </div>

    <div class="setting-group">
      <h4>📚 词库</h4>
      <div class="set-row">
        <select id="dictSelect"></select>
      </div>
      <div class="btn-row">
        <button class="btn-blue" id="loadOnline">加载在线词库</button>
        <button class="btn-orange" id="importLocal">导入本地</button>
      </div>
      <div style="margin-top:10px; font-size:12px; color:var(--text-muted);" id="loadStatus"></div>
      <div class="progress-bar" style="max-width:100%; margin-top:10px; display:none;" id="loadProgressBar">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="loadProgressFill"></div>
        </div>
        <div class="progress-percent">
          <span class="num" id="loadProgressNum">0</span>%
        </div>
      </div>
      <input type="file" id="fileInput" accept=".json" multiple style="display:none;">
    </div>

    <div class="setting-group">
      <h4>🎯 每日目标</h4>
      <div class="set-row">
        <span class="set-label">每天背几个</span>
        <input type="number" id="dailyGoal" value="20" min="5" max="500">
      </div>
    </div>

    <div class="setting-group">
      <h4>⏱️ 播放设置</h4>
      <div class="set-row">
        <span class="set-label">间隔（秒）</span>
        <input type="number" id="interval" value="2" min="1" max="30">
      </div>
      <div class="set-row">
        <span class="set-label">单词朗读次数</span>
        <input type="number" id="enReadCount" value="2" min="1" max="5">
      </div>
      <div class="set-row">
        <span class="set-label">朗读速率</span>
        <input type="number" id="speechRate" value="1" min="0.5" max="2" step="0.1">
      </div>
    </div>

    <div class="setting-group">
      <h4>🔊 朗读内容</h4>
      <div class="set-row">
        <span class="set-label">英文</span>
        <div class="switch active" id="readEnSwitch"></div>
      </div>
      <div class="set-row">
        <span class="set-label">释义</span>
        <div class="switch" id="readMeanSwitch"></div>
      </div>
      <div class="set-row">
        <span class="set-label">例句</span>
        <div class="switch active" id="readSenSwitch"></div>
      </div>
    </div>

    <div class="setting-group">
      <h4>📦 数据管理</h4>
      <div class="btn-row">
        <button class="btn-green" id="exportData">📤 导出进度</button>
        <button class="btn-red" id="resetData">🗑️ 清空标记</button>
      </div>
    </div>

  </section>

</main>

<nav class="tab-bar">
  <button class="tab-btn active" data-tab="study"><span class="icon">🏠</span><span>刷词</span></button>
  <button class="tab-btn" data-tab="data"><span class="icon">📊</span><span>数据</span></button>
  <button class="tab-btn" data-tab="star"><span class="icon">⭐</span><span>生词</span></button>
  <button class="tab-btn" data-tab="settings"><span class="icon">⚙️</span><span>设置</span></button>
</nav>

<div class="test-overlay" id="testOverlay">
  <div class="test-header">
    <div class="progress" id="testProgress">第 1 / 10 题</div>
    <button class="test-close" id="testClose">✕</button>
  </div>
  <div class="test-word" id="testWord">—</div>
  <div class="test-options" id="testOptions"></div>
  <div class="test-footer" id="testFooter">✅ 0 · ❌ 0</div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
